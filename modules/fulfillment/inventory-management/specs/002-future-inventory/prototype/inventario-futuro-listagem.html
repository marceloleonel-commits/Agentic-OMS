  const DESTINATION_DELAY = 400

  const destinationList = { search: '', loaded: 0, loading: false, token: 0 }

  /* A seleção pendente vive fora do DOM porque a lista se refaz a cada busca e a
     cada página: um destino marcado que sai da lista continua marcado, e é isso
     que o Aplicar precisa enxergar. */
  const pendingSelection = { destinations: new Set(), statuses: new Set() }

  const destinationMatches = () => {
    const term = norm(destinationList.search.trim())
    return term ? DESTINATION_OPTIONS.filter((o) => norm(o).includes(term)) : DESTINATION_OPTIONS
  }

  /* As cinco barras do FilterListSkeleton, com as larguras que o componente fixa
     e o respiro de 8px na primeira e na última. */
  const filterSkeletonHtml = () => {
    const bar = (width, extra = '') =>
      `<div data-sl-skeleton data-sl-skeleton-shape="rect"
            style="--sl-skeleton-width: ${width}; --sl-skeleton-height: 1.25rem; ${extra}"></div>`

    return `
      <div data-sl-stack data-horizontal="false" style="--sl-stack-space: var(--sl-space-4)">
        ${bar('8.75rem', 'margin-top: var(--sl-space-2)')}
        ${bar('10rem')}
        ${bar('7.5rem')}
        ${bar('8.75rem')}
        ${bar('10rem', 'margin-bottom: var(--sl-space-2)')}
      </div>`
  }

  /* Busca sem resultado dentro de um filtro usa o EmptyState pequeno, não o
     large da Collection: o popover tem 260px e a story do Filter fixa 15rem. */
  const filterEmptyHtml = () => `
    <div data-sl-empty-state data-sl-size="small" style="height: 15rem">
      <div data-sl-empty-state-container>
        <div data-sl-empty-state-illustration
             style="color: var(--sl-color-gray-8)">${icon('magnifying-glass')}</div>
        <h3 data-sl-heading>Nenhum resultado encontrado</h3>
        <span data-sl-text data-variant="body">Tente outros termos</span>
      </div>
    </div>`

  const filterSpinnerHtml = () => `
    <div class="filter-list-more">
      <div data-sl-spinner aria-live="assertive" aria-atomic="true">
        <svg viewBox="0 0 50 50" width="16" height="16" role="img" aria-label="Carregando">
          <circle cx="25" cy="25" r="20"></circle>
        </svg>
      </div>
    </div>`

  /* A página seguinte é acrescentada, nunca redesenhada: reescrever a lista
     inteira zeraria o scroll, e quem acabou de chegar ao fim voltaria ao topo. */
  function renderDestinationList({ append = false } = {}) {
    const list = filterNode('destinations').querySelector('[data-sl-filter-list]')
    const matches = destinationMatches()
    const shown = matches.slice(0, destinationList.loaded)
    const spinner = destinationList.loading ? filterSpinnerHtml() : ''

    if (append) {
      const onScreen = list.querySelectorAll('[data-sl-filter-item]').length
      const more = list.querySelector('.filter-list-more')
      if (more) more.remove()
      list.insertAdjacentHTML('beforeend', itemsHtml(shown.slice(onScreen)) + spinner)
      return
    }

    list.innerHTML = shown.length ? itemsHtml(shown) + spinner
      : destinationList.loading ? filterSkeletonHtml()
      : matches.length ? '' : filterEmptyHtml()
  }

  const itemsHtml = (options) => options
    .map((o) => filterItemHtml(o, o, pendingSelection.destinations.has(o))).join('')

  /* Simula a chamada que traz a página seguinte. O token descarta a resposta de
     uma busca que já foi substituída por outra — sem ele, uma busca lenta
     escreveria por cima do resultado de uma busca mais nova. */
  function loadDestinations({ reset = false } = {}) {
    const total = destinationMatches().length
    if (!reset && (destinationList.loading || destinationList.loaded >= total)) return

    if (reset) destinationList.loaded = 0
    destinationList.loading = true
    const token = ++destinationList.token
    renderDestinationList({ append: !reset })

    setTimeout(() => {
      if (token !== destinationList.token) return
      destinationList.loading = false
      destinationList.loaded = Math.min(destinationList.loaded + DESTINATION_PAGE,
        destinationMatches().length)
      renderDestinationList({ append: !reset })
    }, DESTINATION_DELAY)
  }

  function onDestinationScroll(event) {
    const list = event.currentTarget
    if (list.scrollHeight - list.scrollTop - list.clientHeight < 48) loadDestinations()
  }

  function setFilterItemSelected(item, selected) {
    item.setAttribute('aria-selected', String(selected))
    item.querySelector('[data-sl-filter-item-check]').innerHTML = selected
      ? `<span data-sl-filter-item-check-indicator data-multiselect="true">${CHECK}</span>`
      : ''
  }

  /* Abrir um filtro de lista mostra o que está aplicado. Como não existe botão
     de cancelar, fechar sem aplicar é desistir — e uma marca pendente que ficou
     numa página fora da tela seria pior ainda, porque ninguém a veria antes de
     ela entrar no filtro. A busca também recomeça vazia: ela é ferramenta para
     achar a opção, não parte do que foi filtrado. */
  function resetListFilter(name) {
    if (name === 'destinations') {
      pendingSelection.destinations = new Set(state.filters.destinations)
      filterNode('destinations').querySelector('[data-sl-search-input]').value = ''
      destinationList.search = ''
      loadDestinations({ reset: true })
      return
    }

    if (name === 'statuses') {
      pendingSelection.statuses = new Set(effectiveStatuses())
      for (const item of filterNode('statuses').querySelectorAll('[data-sl-filter-item]')) {
        setFilterItemSelected(item, pendingSelection.statuses.has(item.dataset.value))
      }
    }
  }

  /* O rótulo vira <span> quando o controle não é rotulável — o caso do
     DatePicker, que é uma lista de divs e se liga ao rótulo por aria-labelledby.

     A linha de erro é o FieldError do componente e nasce escondida: marcar um
     campo passa a ser trocar dois atributos, e não remontar o campo — o que
     apagaria o que está sendo digitado. */
  /* A ordem é a do componente: rótulo, campo, descrição e erro. A descrição é
     onde mora a ajuda de preenchimento — placeholder não serve para isso. */
  function fieldHtml(id, label, control, { labelable = true, error = null, description = null } = {}) {
    const tag = labelable
      ? `<label data-sl-label id="${id}-label" for="${id}">`
      : `<span data-sl-label id="${id}-label">`

    return `
      <div data-sl-field data-space="normal">
        ${tag}${escapeHtml(label)}${labelable ? '</label>' : '</span>'}
        ${control}
        ${description ? `<div data-sl-field-description id="${id}-description">${escapeHtml(description)}</div>` : ''}
        ${error ? `<span data-sl-field-error role="alert" id="${id}-error" data-error-for="${escapeHtml(error)}" hidden></span>` : ''}
      </div>`
  }

  /* O Input do Shoreline é um div que envolve o campo: a moldura, a altura e o
     anel de foco moram no data-sl-input, e o padding lateral só existe na regra
     que mira o data-sl-input-element dentro dele. */
  function inputHtml(id, attrs) {
    return `
      <div data-sl-input>
        <input data-sl-input-element id="${id}" ${attrs}>
      </div>`
  }

  /* ── Campo de data ───────────────────────────────────────────
     O DatePicker do Shoreline compõe o DateField — a lista de segmentos
     editáveis — com um IconButton que abre o Calendar num Popover. Em React,
     quem move o cursor entre os segmentos, incrementa com as setas e monta a
     grade do mês é o React Aria; aqui esse comportamento é reescrito, mas a
     árvore de atributos e todo o desenho continuam sendo os do componente.

     Data aqui é sempre string ISO, como no resto do arquivo. Nenhum objeto Date
     atravessa o filtro: é o que impede o fuso de deslocar o dia.
     ───────────────────────────────────────────────────────────── */

  const SEGMENTS = [
    { type: 'day',   size: 2, min: 1,    max: 31,   empty: 'dd',   label: 'dia' },
    { type: 'month', size: 2, min: 1,    max: 12,   empty: 'mm',   label: 'mês' },
    { type: 'year',  size: 4, min: 1900, max: 2100, empty: 'aaaa', label: 'ano' },
  ]

  const CALENDAR_ICON = icon('calendar-blank')
  const CARET_LEFT = icon('caret-left')

  const pad = (value, size) => String(value).padStart(size, '0')
  const clamp = (value, min, max) => Math.min(Math.max(value, min), max)
  const daysInMonth = (year, month) => new Date(year, month, 0).getDate()

  function todayIso() {
    const now = new Date()
    return `${now.getFullYear()}-${pad(now.getMonth() + 1, 2)}-${pad(now.getDate(), 2)}`
  }

  const isoParts = (iso) => {
    const [year, month, day] = iso ? iso.split('-').map(Number) : [null, null, null]
    return { year, month, day }
  }

  /* 4 de janeiro de 2026 foi um domingo, que é onde a semana começa em pt-BR.
     O estilo "narrow" é o padrão do useCalendarGrid, então D S T Q Q S S. */
  const WEEKDAYS = (() => {
    const format = new Intl.DateTimeFormat('pt-BR', { weekday: 'narrow' }).format
    return [...Array(7).keys()].map((i) => format(new Date(2026, 0, 4 + i)))
  })()

  const monthTitle = (year, month) =>
    new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' })
      .format(new Date(year, month - 1, 1))

  function segmentHtml(segment, value) {
    const isEmpty = value === null
    return `<div data-sl-date-segment data-segment="${segment.type}"
                 data-placeholder="${isEmpty}" role="spinbutton" tabindex="0"
                 aria-label="${segment.label}"
            >${isEmpty ? segment.empty : pad(value, segment.size)}</div>`
  }

  /* O valor de verdade fica num input escondido, em ISO: é dele que o
     applyFilter lê, então a leitura do filtro não muda por causa do campo. */
  function datePickerHtml(id, role, iso, min) {
    const parts = isoParts(iso)
    const separator = '<div data-sl-date-segment aria-hidden="true">/</div>'

    return `
      <div class="date-picker" data-sl-date-picker data-min="${min || ''}">
        <input type="hidden" data-role="${role}" value="${iso || ''}">
        <div data-sl-date-picker-input>
          <div data-sl-date-field>
            <div data-sl-date-field-segment-list role="group" aria-labelledby="${id}-label">
              ${SEGMENTS.map((s) => segmentHtml(s, parts[s.type])).join(separator)}
            </div>
          </div>
          <div data-sl-bleed>
            <div data-sl-bleed-content style="--sl-bleed-end: var(--sl-space-2)">
              <button type="button" data-sl-button data-sl-icon-button data-sl-date-picker-button
                      data-variant="tertiary" data-size="normal"
                      aria-label="Escolher data" aria-expanded="false">
                <span data-sl-button-content>${CALENDAR_ICON}</span>
              </button>
            </div>
          </div>
        </div>
        <div class="calendar-popover" data-sl-popover></div>
      </div>`
  }

  function calendarCellHtml(year, month, day, selectedIso, min) {
    const iso = `${year}-${pad(month, 2)}-${pad(day, 2)}`
    const isSelected = iso === selectedIso

    /* Numa data única o próprio componente marca a célula como início e fim da
       seleção ao mesmo tempo — é o que arredonda os dois lados. */
    return `
      <td data-sl-calendar-cell>
        <button type="button" data-sl-button data-sl-icon-button data-sl-calendar-cell-button
                data-variant="tertiary" data-size="normal" data-date="${iso}"
                ${min && iso < min ? 'disabled' : ''}
                data-selected="${isSelected}"
                data-selection-start="${isSelected}" data-selection-end="${isSelected}"
                aria-label="${day} de ${monthTitle(year, month)}">
          <span data-sl-button-content><span>${day}</span></span>
        </button>
      </td>`
  }

  /* O mínimo vem do campo, não do calendário: a data de chegada de um lote novo
     começa amanhã, enquanto o filtro de chegada precisa alcançar o que já chegou. */
  function calendarHtml(monthKey, selectedIso, min) {
    const [year, month] = monthKey.split('-').map(Number)
    const firstWeekday = new Date(year, month - 1, 1).getDay()
    const total = daysInMonth(year, month)
    const weeks = Math.ceil((firstWeekday + total) / 7)

    const cells = [...Array(weeks * 7).keys()].map((i) => {
      const day = i - firstWeekday + 1
      return day >= 1 && day <= total
        ? calendarCellHtml(year, month, day, selectedIso, min)
        : '<td data-sl-calendar-cell></td>'
    })

    const rows = [...Array(weeks).keys()]
      .map((i) => `<tr>${cells.slice(i * 7, i * 7 + 7).join('')}</tr>`).join('')

    const navButton = (direction, label, glyph) => `
      <button type="button" data-sl-button data-sl-icon-button data-variant="tertiary"
              data-size="normal" data-calendar-nav="${direction}" aria-label="${label}">
        <span data-sl-button-content>${glyph}</span>
      </button>`

    return `
      <div data-sl-calendar role="group" aria-label="${escapeHtml(monthTitle(year, month))}">
        <div data-sl-calendar-header>
          ${navButton('prev', 'Mês anterior', CARET_LEFT)}
          <h2 data-sl-calendar-title>${escapeHtml(monthTitle(year, month))}</h2>
          ${navButton('next', 'Próximo mês', CARET_RIGHT)}
        </div>
        <table data-sl-calendar-grid>
          <thead data-sl-calendar-grid-header>
            <tr>${WEEKDAYS.map((d) => `<th>${d}</th>`).join('')}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`
  }

  const hiddenOf = (picker) => picker.querySelector('input[type="hidden"]')
  const segmentOf = (picker, type) => picker.querySelector(`[data-segment="${type}"]`)
  const segmentValue = (el) => (el.dataset.placeholder === 'true' ? null : Number(el.textContent))

  function writeSegment(el, value) {
    const segment = SEGMENTS.find((s) => s.type === el.dataset.segment)
    el.dataset.placeholder = String(value === null)
    el.textContent = value === null ? segment.empty : pad(value, segment.size)
  }

  /* O campo avisa quando o valor muda em vez de esperar o foco sair: quem depende
     dele grava no mesmo instante, e o que está na tela nunca discorda do que será
     salvo. */
  const announceDate = (picker) =>
    picker.dispatchEvent(new CustomEvent('sl-date-change', { bubbles: true }))

  function setPickerDate(picker, iso) {
    const parts = isoParts(iso)
    hiddenOf(picker).value = iso || ''
    SEGMENTS.forEach((s) => writeSegment(segmentOf(picker, s.type), parts[s.type]))
    announceDate(picker)
  }

  /* Uma data pela metade não filtra nada, então o valor só existe com os três
     segmentos preenchidos. Um 31 digitado em fevereiro recua para o último dia
     do mês, e o segmento acompanha — o campo nunca mostra data que não existe. */
  function syncPickerFromSegments(picker) {
    const values = Object.fromEntries(
      SEGMENTS.map((s) => [s.type, segmentValue(segmentOf(picker, s.type))]))

    if (!values.day || !values.month || !values.year) {
      hiddenOf(picker).value = ''
      announceDate(picker)
      return
    }

    const day = Math.min(values.day, daysInMonth(values.year, values.month))
    if (day !== values.day) writeSegment(segmentOf(picker, 'day'), day)

    hiddenOf(picker).value = `${pad(values.year, 4)}-${pad(values.month, 2)}-${pad(day, 2)}`
    announceDate(picker)
  }

  function openCalendar(picker, isOpen) {
    const popover = picker.querySelector('.calendar-popover')
    const trigger = picker.querySelector('[data-sl-date-picker-button]')

    if (isOpen) {
      const iso = hiddenOf(picker).value
      popover.dataset.month = (iso || picker.dataset.min || todayIso()).slice(0, 7)
      popover.innerHTML = calendarHtml(popover.dataset.month, iso, picker.dataset.min)
    }

    picker.dataset.open = String(isOpen)
    trigger.setAttribute('aria-expanded', String(isOpen))
  }

  /* A raiz importa: fechar todo calendário da página serve para o clique que cai
     fora de qualquer campo de data, mas quem fecha os filtros não pode alcançar o
     campo do formulário, que vive fora deles. */
  const closeAllCalendars = (root = document) =>
    root.querySelectorAll('[data-sl-date-picker][data-open="true"]')
      .forEach((picker) => openCalendar(picker, false))

  function shiftCalendarMonth(popover, delta) {
    const picker = popover.closest('[data-sl-date-picker]')
    const [year, month] = popover.dataset.month.split('-').map(Number)
    const moved = new Date(year, month - 1 + delta, 1)
    popover.dataset.month = `${moved.getFullYear()}-${pad(moved.getMonth() + 1, 2)}`
    popover.innerHTML = calendarHtml(popover.dataset.month, hiddenOf(picker).value, picker.dataset.min)
  }

  /* O padding do rodapé vem do data-sl-content, como no componente real. */
  function footerHtml() {
    return `
      <footer data-sl-filter-popover-footer data-sl-content data-narrow="true">
        <button data-sl-button data-variant="tertiary" data-size="normal" data-role="clear"><span data-sl-button-content>Limpar</span></button>
        <button data-sl-button data-variant="primary" data-size="normal" data-role="apply"><span data-sl-button-content>Aplicar</span></button>
      </footer>`
  }

  function buildFilterBodies() {
    const f = state.filters

    const fill = (name, content) => {
      filterNode(name).querySelector('[data-sl-container]').innerHTML = content + footerHtml()
    }

    pendingSelection.destinations = new Set(f.destinations)
    pendingSelection.statuses = new Set(effectiveStatuses())

    /* O data-sl-combobox-list é o que tira o padding de cima da lista quando há
       busca acima dela — sem ele sobra um vão entre a Search e o primeiro item. */
    fill('destinations', `
      <div data-sl-content data-narrow="true" data-sl-filter-popover-combobox>
        <div data-sl-search>
          <span data-sl-pre-icon>${icon('magnifying-glass-small')}</span>
          <input data-sl-search-input data-role="destination-search"
                 placeholder="Buscar destino" autocomplete="off">
        </div>
      </div>
      <div data-sl-filter-list data-sl-combobox-list role="listbox" aria-multiselectable="true"></div>`)

    destinationList.search = ''
    destinationList.loaded = 0
    destinationList.loading = false
    destinationList.token += 1
    filterNode('destinations').querySelector('[data-sl-filter-list]')
      .addEventListener('scroll', onDestinationScroll)

    /* Status tem quatro opções: abaixo dos cinco em que o Shoreline manda pôr
       busca, e curto o bastante para não precisar de carregamento em partes. */
    fill('statuses', optionListHtml(
      STATUSES.map((s) => ({ value: s.id, label: s.label })), effectiveStatuses()))

    fill('arrival', `
      <div data-sl-content>
        <div data-sl-stack data-horizontal="false" data-fluid="true">
          ${fieldHtml('filter-arrival-start', 'De',
            datePickerHtml('filter-arrival-start', 'start', f.arrival.start), { labelable: false })}
          ${fieldHtml('filter-arrival-end', 'Até',
            datePickerHtml('filter-arrival-end', 'end', f.arrival.end), { labelable: false })}
          <span data-sl-field-error role="alert" data-role="error" hidden>A data final é anterior à inicial.</span>
        </div>
      </div>`)

    /* Sem type="number": o Shoreline não tem campo numérico, e o Input é um
       campo de texto que pode restringir caracteres. O inputmode chama o teclado
       numérico no celular sem trazer o spinner do navegador. */
    fill('quantity', `
      <div data-sl-content>
        <div data-sl-stack data-horizontal="false" data-fluid="true">
          ${fieldHtml('filter-quantity-min', 'Mínima', inputHtml('filter-quantity-min',
            `type="text" inputmode="numeric" data-role="min" value="${f.quantity.min ?? ''}"`))}
          ${fieldHtml('filter-quantity-max', 'Máxima', inputHtml('filter-quantity-max',
            `type="text" inputmode="numeric" data-role="max" value="${f.quantity.max ?? ''}"`))}
        </div>
      </div>`)
  }

  function syncFilterTriggers() {
    const f = state.filters

    /* O FilterValue mostra o rótulo do primeiro selecionado e a contagem do
       resto, no formato ": primeiro, +n" — o componente diz para não customizar
       esse resumo, e a contagem sozinha que havia aqui não dizia qual era. */
    const listSummary = (labels) => labels.length
      ? `: ${labels[0]}${labels.length > 1 ? `, +${labels.length - 1}` : ''}`
      : ''

    const summaries = {
      destinations: listSummary(f.destinations),
      statuses: listSummary(effectiveStatuses().map((id) => statusById(id).label)),
      arrival: f.arrival.start || f.arrival.end
        ? `: ${f.arrival.start ? formatDate(f.arrival.start) : '…'} – ${f.arrival.end ? formatDate(f.arrival.end) : '…'}`
        : '',
      quantity: f.quantity.min !== null || f.quantity.max !== null
        ? `: ${f.quantity.min ?? '…'} – ${f.quantity.max ?? '…'}`
        : '',
    }

    for (const [name, summary] of Object.entries(summaries)) {
      filterNode(name).querySelector('[data-sl-filter-value]').textContent = summary
    }
  }

  function closeAllFilters() {
    closeAllCalendars(el('filter-row'))
    for (const node of document.querySelectorAll('.filter')) {
      node.dataset.open = 'false'
      node.querySelector('[data-sl-filter-trigger]').setAttribute('aria-expanded', 'false')
    }
  }

  function closeHeaderHelp() {
    for (const node of document.querySelectorAll('.header-help')) {
      node.dataset.open = 'false'
      node.querySelector('[data-sl-contextual-help-trigger]').setAttribute('aria-expanded', 'false')
    }
  }

  function applyFilter(name, node) {
    const f = state.filters

    /* A seleção vem do conjunto pendente, não do DOM: na lista de destinos o que
       está na tela é só a página carregada da busca atual. A ordem do catálogo é
       reimposta aqui para o resumo do gatilho não depender da ordem de clique. */
    if (name === 'destinations') {
      f.destinations = DESTINATION_OPTIONS.filter((o) => pendingSelection.destinations.has(o))
    }

    if (name === 'statuses') {
      f.statuses = STATUSES.filter((s) => pendingSelection.statuses.has(s.id)).map((s) => s.id)
      state.statusesTouched = true
    }

    if (name === 'arrival') {
      const start = node.querySelector('[data-role="start"]').value || null
      const end = node.querySelector('[data-role="end"]').value || null
      const error = node.querySelector('[data-role="error"]')

      if (!isDateRangeValid(start, end)) {
        error.hidden = false
        return false
      }

      error.hidden = true
      f.arrival = { start, end }
    }

    if (name === 'quantity') {
      const raw = (role) => node.querySelector(`[data-role="${role}"]`).value
      const min = raw('min') === '' ? null : Number(raw('min'))
      const max = raw('max') === '' ? null : Number(raw('max'))
      f.quantity = { min, max }
    }

    return true
  }

  /* ── Eventos ─────────────────────────────────────────────── */

  el('search').addEventListener('input', (event) => {
    state.search = event.target.value
    state.collapsedDuringSearch.clear()
    resetToFirstPage()
    render()
  })

  el('view-toggle').addEventListener('click', (event) => {
    const button = event.target.closest('[data-view]')
    if (button) setView(button.dataset.view)
  })

  el('btn-export').addEventListener('click', exportRows)

  /* A ajuda contextual é delegada no cabeçalho porque renderTableHead refaz o
     conteúdo dele a cada troca de visão. */
  el('thead').addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-sl-contextual-help-trigger]')
    if (!trigger) return

    const help = trigger.closest('.header-help')
    const willOpen = help.dataset.open !== 'true'

    closeAllFilters()
    help.dataset.open = String(willOpen)
    trigger.setAttribute('aria-expanded', String(willOpen))
  })

  el('tbody').addEventListener('click', (event) => {
    const button = event.target.closest('[data-toggle]')
    if (!button) return

    const lotId = button.dataset.toggle
    const wasExpanded = button.getAttribute('aria-expanded') === 'true'

    if (wasExpanded) {
      state.expanded.delete(lotId)
      if (state.search.trim()) state.collapsedDuringSearch.add(lotId)
    } else {
      state.expanded.add(lotId)
      state.collapsedDuringSearch.delete(lotId)
    }

    render()
  })

  const goToPage = (delta) => {
    state.page += delta
    state.expanded.clear()
    render()
  }

  for (const id of ['pag-prev', 'pag-prev-2']) el(id).addEventListener('click', () => goToPage(-1))
  for (const id of ['pag-next', 'pag-next-2']) el(id).addEventListener('click', () => goToPage(1))

  document.getElementById('filter-row').addEventListener('click', (event) => {
    const node = event.target.closest('.filter')
    if (!node) return

    const name = node.dataset.filter

    if (event.target.closest('[data-sl-filter-trigger]')) {
      const willOpen = node.dataset.open !== 'true'
      closeAllFilters()
      node.dataset.open = String(willOpen)
      node.querySelector('[data-sl-filter-trigger]').setAttribute('aria-expanded', String(willOpen))

      /* A primeira página de destinos só é buscada quando o filtro abre —
         carregar 48 numa tela que talvez ninguém filtre é trabalho à toa. */
      if (willOpen) resetListFilter(name)
      return
    }

    const picker = event.target.closest('[data-sl-date-picker]')

    /* Um calendário aberto se fecha ao clicar em qualquer outro lugar, inclusive
       no campo vizinho — dois calendários nunca ficam abertos ao mesmo tempo. */
    document.querySelectorAll('[data-sl-date-picker][data-open="true"]')
      .forEach((other) => { if (other !== picker) openCalendar(other, false) })

    if (picker) {
      if (event.target.closest('[data-sl-date-picker-button]')) {
        openCalendar(picker, picker.dataset.open !== 'true')
        return
      }

      const nav = event.target.closest('[data-calendar-nav]')
      if (nav) {
        shiftCalendarMonth(picker.querySelector('.calendar-popover'),
          nav.dataset.calendarNav === 'prev' ? -1 : 1)
        return
      }

      const cell = event.target.closest('[data-sl-calendar-cell-button]')
      if (cell) {
        setPickerDate(picker, cell.dataset.date)
        openCalendar(picker, false)
        return
      }

      /* Clicar na moldura leva o cursor para o primeiro segmento, como no
         componente: o alvo de clique é a caixa inteira, não cada pedacinho. */
      if (!event.target.closest('[data-segment]')) {
        segmentOf(picker, 'day').focus()
      }
      return
    }

    const item = event.target.closest('[data-sl-filter-item]')
    if (item) {
      const willSelect = item.getAttribute('aria-selected') !== 'true'
      setFilterItemSelected(item, willSelect)

      const selection = pendingSelection[name]
      if (willSelect) selection.add(item.dataset.value)
      else selection.delete(item.dataset.value)
      return
    }

    const action = event.target.closest('[data-role]')
    if (!action) return

    if (action.dataset.role === 'clear') {
      if (name === 'arrival') state.filters.arrival = { start: null, end: null }
      else if (name === 'quantity') state.filters.quantity = { min: null, max: null }
      else state.filters[name] = []

      /* Limpar o status aqui é pedir para ver tudo, inclusive recebido e cancelado:
         a partir daí a lista é escolha de quem está olhando, não o padrão da tela. */
      if (name === 'statuses') state.statusesTouched = true

      buildFilterBodies()
      resetToFirstPage()
      closeAllFilters()
      render()
      return
    }

    if (action.dataset.role === 'apply') {
      if (!applyFilter(name, node)) return
      resetToFirstPage()
      closeAllFilters()
      render()
    }
  })

  /* Teclado do campo de data, reescrevendo o que o React Aria faz no componente:
     dígitos preenchem o segmento e pulam para o próximo quando ele não cabe mais
     nada, as setas verticais incrementam, as horizontais andam entre segmentos e
     o backspace esvazia. O buffer guarda o que foi digitado até aqui, para que
     "1" e depois "5" virem 15 em vez de 5.

     Delegado numa raiz qualquer: o filtro de chegada e a data do formulário são
     o mesmo campo, e um comportamento de teclado que valesse só num dos dois
     seria a mesma peça com duas personalidades. */
  function bindDateSegments(root) {
    root.addEventListener('keydown', onSegmentKeydown)
    root.addEventListener('focusout', onSegmentFocusout)
  }

  function onSegmentKeydown(event) {
    const el = event.target.closest('[data-segment]')
    if (!el) return

    const segment = SEGMENTS.find((s) => s.type === el.dataset.segment)
    const picker = el.closest('[data-sl-date-picker]')
    const list = [...picker.querySelectorAll('[data-segment]')]
    const commit = (value) => {
      writeSegment(el, clamp(value, segment.min, segment.max))
      el.dataset.buffer = ''
      syncPickerFromSegments(picker)
    }

    if (/^\d$/.test(event.key)) {
      event.preventDefault()
      let buffer = (el.dataset.buffer || '') + event.key
      if (buffer.length > segment.size) buffer = event.key

      const value = Number(buffer)
      el.dataset.placeholder = 'false'
      el.textContent = buffer.padStart(segment.size, '0')
      el.dataset.buffer = buffer

      /* Fecha o segmento quando ele já não aceita outro dígito — um 4 no dia não
         pode virar 4x, então o cursor segue adiante sem esperar. */
      if (buffer.length === segment.size || value * 10 > segment.max) {
        commit(value)
        const next = list[list.indexOf(el) + 1]
        if (next) next.focus()
      } else {
        syncPickerFromSegments(picker)
      }
      return
    }

    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      event.preventDefault()
      const current = segmentValue(el)
      if (current === null) {
        commit(isoParts(todayIso())[segment.type])
        return
      }
      const step = event.key === 'ArrowUp' ? 1 : -1
      const span = segment.max - segment.min + 1
      commit(((current - segment.min + step + span) % span) + segment.min)
      return
    }

    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault()
      const neighbour = list[list.indexOf(el) + (event.key === 'ArrowLeft' ? -1 : 1)]
      if (neighbour) neighbour.focus()
      return
    }

    if (event.key === 'Backspace' || event.key === 'Delete') {
      event.preventDefault()
      writeSegment(el, null)
      el.dataset.buffer = ''
      syncPickerFromSegments(picker)
    }
  }

  /* Sair do segmento encerra o que estava sendo digitado: um "3" solto no dia
     vira 03 em vez de ficar pendurado esperando o próximo dígito. */
  function onSegmentFocusout(event) {
    const el = event.target.closest('[data-segment]')
    if (!el || !el.dataset.buffer) return

    const segment = SEGMENTS.find((s) => s.type === el.dataset.segment)
    writeSegment(el, clamp(Number(el.dataset.buffer), segment.min, segment.max))
    el.dataset.buffer = ''
    syncPickerFromSegments(el.closest('[data-sl-date-picker]'))
  }

  bindDateSegments(document.getElementById('filter-row'))

  /* A restrição a dígitos é o que o Shoreline pede no lugar do type="number":
     sem ela o campo aceitaria qualquer texto. O cursor volta para onde estava,
     descontando o que foi recusado antes dele, senão pular para o fim atrapalha
     quem corrige um dígito no meio. */
  function bindDigitsOnly(root, selector) {
    root.addEventListener('input', (event) => {
      const field = event.target.closest(selector)
      if (!field) return

      const digits = field.value.replace(/\D/g, '')
      if (digits === field.value) return

      const caret = field.selectionStart
      const antes = field.value.slice(0, caret)
      const destino = caret - (antes.length - antes.replace(/\D/g, '').length)

      field.value = digits
      field.setSelectionRange(destino, destino)
    })
  }

  bindDigitsOnly(document.getElementById('filter-row'), '[data-role="min"], [data-role="max"]')

  /* Espera a digitação parar antes de "chamar a API": sem isso cada tecla
     dispararia uma busca, e o esqueleto piscaria letra a letra. */
  let destinationSearchTimer = null
  document.getElementById('filter-row').addEventListener('input', (event) => {
    if (!event.target.closest('[data-role="destination-search"]')) return

    destinationList.search = event.target.value
    clearTimeout(destinationSearchTimer)
    destinationSearchTimer = setTimeout(() => loadDestinations({ reset: true }), 250)
  })

  document.addEventListener('click', (event) => {
    if (!event.target.closest('.filter')) closeAllFilters()
    if (!event.target.closest('[data-sl-date-picker]')) closeAllCalendars()
    if (!event.target.closest('.header-help')) closeHeaderHelp()
  })

  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return
    closeAllFilters()
    closeHeaderHelp()
  })

  /* ─────────────────────────────────────────────────────────────
     Criação de lote

     Segunda tela do arquivo, atrás de uma rota de hash. A listagem continua
     montada e apenas escondida: é o que faz a busca, os filtros, a visão e a
     página sobreviverem à ida e à volta sem uma linha de código para isso.

     A tela é a única que escreve em LOTS. Todo o resto do arquivo lê.
     ───────────────────────────────────────────────────────────── */

  const ROUTES = { listing: '', create: '#/criar-lote' }

  const shell = document.querySelector('.shell')

  /* Estado do formulário. Quantidade é string porque é o conteúdo cru do campo:
     enquanto o operador apaga para redigitar, ela é '' — e '' não é zero. */
  const form = { name: '', code: '', arrivalDate: null, items: [], seller: null, warehouse: null }

  const snapshot = () => JSON.stringify(form)
  let formPristine = snapshot()
  let onCreateScreen = false

  const ITEMS_PAGE_SIZE = 10
  let itemsSearch = ''
  let itemsPage = 1

  const TRASH = icon('trash')
  const CARET_DOWN_SMALL = icon('caret-down-small')

  const nextCode = () => {
    const highest = LOTS.reduce(
      (top, lot) => Math.max(top, Number(lot.code.replace(/\D/g, '')) || 0), 0)
    return String(highest + 1).padStart(3, '0')
  }

  /* Um lote datado de hoje já perdeu a meia-noite em que viraria estoque
     disponível: nasceria vencido. O mínimo é amanhã. */
  function tomorrowIso() {
    const date = new Date()
    date.setDate(date.getDate() + 1)
    return `${date.getFullYear()}-${pad(date.getMonth() + 1, 2)}-${pad(date.getDate(), 2)}`
  }

  const formTotal = () => form.items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0)

  const productBySku = (skuId) => PRODUCT_CATALOG.find((p) => p.skuId === skuId)

  /* ── Roteador ────────────────────────────────────────────── */

  function handleRoute() {
    const isCreate = location.hash === ROUTES.create

    /* Entrar na rota — pelo botão, por link direto ou pelo voltar do navegador
       — sempre começa um lote novo. */
    if (isCreate && !onCreateScreen) resetForm()
    onCreateScreen = isCreate

    el('screen-listing').hidden = isCreate
    el('screen-create').hidden = !isCreate
    shell.dataset.screen = isCreate ? 'create' : 'listing'
    document.title = isCreate
      ? 'Inventário futuro — Criar lote (protótipo)'
      : 'Inventário futuro — Listagem (protótipo)'

    if (isCreate) el('form-name').focus()
  }

  const goTo = (route) => {
    if ((location.hash || '') === route) handleRoute()
    else location.hash = route
  }

  window.addEventListener('hashchange', handleRoute)

  /* ── Erros de campo ──────────────────────────────────────── */

  /* Um erro é uma linha de FieldError já montada mais a moldura do controle
     ficando crítica. Achar a moldura pelo Field em volta evita marcar cada
     campo com um atributo só para isto. */
  function paintError(field, message) {
    const line = document.querySelector(`[data-error-for="${field}"]`)
    if (!line) return

    line.hidden = !message
    line.textContent = message || ''

    const box = line.closest('[data-sl-field]')
      ?.querySelector('[data-sl-input], [data-sl-date-picker-input]')
    if (box) box.dataset.error = String(Boolean(message))
  }

  const clearErrors = (root) => {
    for (const line of root.querySelectorAll('[data-error-for]')) {
      line.hidden = true
      line.textContent = ''
    }
    for (const box of root.querySelectorAll('[data-error="true"]')) box.dataset.error = 'false'
  }

  /* O primeiro erro recebe o foco. Nem todo campo é um input: a data foca o
     primeiro segmento, e a seção de produtos foca o botão que a resolve. */
  function focusTarget(field) {
    if (field === 'items') return el('btn-add-products')
    if (field === 'form-arrival') return el('screen-create').querySelector('[data-segment="day"]')
    if (field.startsWith('item:')) return document.querySelector(`[data-qty="${field.slice(5)}"]`)
    return el(field)
  }

  /* ── Combobox ────────────────────────────────────────────────
     O Combobox desta versão do Shoreline é um invólucro do Ariakit que emite
     quatro atributos e estiliza um. A composição daqui usa as peças que têm
     desenho: o Input no gatilho, e o popover, o item, o item ativo e a marca
     de escolhido do Select — que é o irmão de escolha única deste campo.
     ───────────────────────────────────────────────────────────── */

  const COMBOBOX_LIMIT = 10
  const SKU_TAKEN = 'Já está no lote'

  function comboboxHtml(id, { kind, row = '', value = '', placeholder = '', disabled = false }) {
    return `
      <div class="combobox" data-sl-select data-combobox="${kind}" data-row="${row}" data-open="false">
        <div data-sl-input${disabled ? ' data-disabled="true"' : ''}>
          <input data-sl-input-element id="${id}" type="text" role="combobox" autocomplete="off"
                 aria-expanded="false" aria-autocomplete="list" aria-controls="${id}-list"
                 placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}"${disabled ? ' disabled' : ''}>
          <span class="combobox-caret">${CARET_DOWN_SMALL}</span>
        </div>
        <div class="combobox-popover" data-sl-select-popover data-enter role="listbox" id="${id}-list"></div>
      </div>`
  }

  /* A fonte de cada campo. O SKU marca o que já está no lote: o conjunto une os
     produtos já comprometidos e os escolhidos nas outras linhas da drawer, que
     é o que impede o mesmo SKU de entrar duas vezes no mesmo lote (INV-2). */
  function comboboxSource(node) {
    const kind = node.dataset.combobox

    if (kind === 'seller') return SELLERS.map((seller) => ({ value: seller, label: seller }))

    if (kind === 'warehouse') {
      return warehousesOf(form.seller).map((warehouse) => ({ value: warehouse, label: warehouse }))
    }

    const taken = new Set([
      ...form.items.map((item) => item.skuId),
      ...drawer.rows
        .filter((other) => other.id !== node.dataset.row && other.skuId)
        .map((other) => other.skuId),
    ])

    return PRODUCT_CATALOG.map((product) => ({
      value: product.skuId,
      label: product.name,
      hint: `SKU ID ${product.skuId}`,
      disabled: taken.has(product.skuId),
    }))
  }

  const comboboxSelected = (node) => {
    const kind = node.dataset.combobox
    if (kind === 'seller') return form.seller
    if (kind === 'warehouse') return form.warehouse
    const row = drawer.rows.find((r) => r.id === node.dataset.row)
    return row ? row.skuId : null
  }

  function renderComboboxList(node) {
    const input = node.querySelector('[data-sl-input-element]')
    const term = norm((input.dataset.typed || '').trim())
    const selected = comboboxSelected(node)

    const all = comboboxSource(node)
      .filter((option) => !term || norm(`${option.label} ${option.hint || ''}`).includes(term))

    const shown = all.slice(0, COMBOBOX_LIMIT)

    const items = shown.map((option) => `
      <div data-sl-select-item role="option" data-value="${escapeHtml(option.value)}"
           aria-selected="${option.value === selected}" aria-disabled="${Boolean(option.disabled)}">
        ${option.value === selected ? `<span data-sl-select-item-check>${CHECK}</span>` : ''}
        <span class="combobox-item-text">
          <span>${escapeHtml(option.label)}</span>
          ${option.hint ? `<span class="cell-soft">${escapeHtml(option.hint)}</span>` : ''}
        </span>
        ${option.disabled ? `<span class="combobox-reason">${SKU_TAKEN}</span>` : ''}
      </div>`).join('')

    const more = all.length > shown.length
      ? `<div class="combobox-empty">Refine a busca para ver os outros ${all.length - shown.length}</div>`
      : ''

    node.querySelector('.combobox-popover').innerHTML =
      items ? items + more : '<div class="combobox-empty">Nenhum resultado</div>'
  }

  function openCombobox(node, isOpen) {
    const input = node.querySelector('[data-sl-input-element]')

    if (isOpen) {
      closeAllComboboxes(node)
      input.dataset.typed = ''
      renderComboboxList(node)
    } else {
      /* Fechar sem escolher devolve o rótulo do que estava escolhido: o campo
         nunca fica mostrando um texto que não corresponde ao valor. */
      input.value = comboboxLabel(node)
      delete input.dataset.typed
    }

    node.dataset.open = String(isOpen)
    input.setAttribute('aria-expanded', String(isOpen))
  }

  function comboboxLabel(node) {
    const selected = comboboxSelected(node)
    if (!selected) return ''
    if (node.dataset.combobox !== 'sku') return selected
    const product = productBySku(selected)
    return product ? product.name : ''
  }

  const closeAllComboboxes = (except) => {
    for (const node of document.querySelectorAll('.combobox[data-open="true"]')) {
      if (node !== except) openCombobox(node, false)
    }
  }

  function chooseComboboxValue(node, value) {
    const kind = node.dataset.combobox

    if (kind === 'seller') {
      form.seller = value
      form.warehouse = null
      paintError('form-seller', '')
      renderDestination()
      return
    }

    if (kind === 'warehouse') {
      form.warehouse = value
      paintError('form-warehouse', '')
      openCombobox(node, false)
      return
    }

    const row = drawer.rows.find((r) => r.id === node.dataset.row)
    row.skuId = value
    paintError(`drawer-sku-${row.id}`, '')
    syncDrawerConfirm()
    openCombobox(node, false)
  }

  /* O item ativo é o do teclado. O Select do Shoreline pinta com data-active-item,
     então mover a seta é mover esse atributo. */
  function moveComboboxActive(node, delta) {
    const items = [...node.querySelectorAll('[data-sl-select-item][aria-disabled="false"]')]
    if (!items.length) return

    const current = items.findIndex((item) => item.hasAttribute('data-active-item'))
    const next = items[Math.min(Math.max(current + delta, 0), items.length - 1)] || items[0]

    for (const item of items) item.removeAttribute('data-active-item')
    next.setAttribute('data-active-item', '')
    next.scrollIntoView({ block: 'nearest' })
  }

  /* Um único conjunto de eventos serve aos três campos: a diferença entre eles
     está na fonte e no que fazer com o escolhido, não na interação. */
  function bindComboboxes(root) {
    root.addEventListener('input', (event) => {
      const input = event.target.closest('.combobox [data-sl-input-element]')
      if (!input) return

      /* Abrir antes de guardar o termo: openCombobox zera o que foi digitado,
         e digitar num campo fechado é o gesto mais comum de todos. */
      const node = input.closest('.combobox')
      if (node.dataset.open !== 'true') openCombobox(node, true)

      input.dataset.typed = input.value
      renderComboboxList(node)
    })

    root.addEventListener('click', (event) => {
      const item = event.target.closest('[data-sl-select-item]')
      if (item) {
        if (item.getAttribute('aria-disabled') === 'true') return
        chooseComboboxValue(item.closest('.combobox'), item.dataset.value)
        return
      }

      const input = event.target.closest('.combobox [data-sl-input-element]')
      if (input && !input.disabled) {
        const node = input.closest('.combobox')
        if (node.dataset.open !== 'true') openCombobox(node, true)
      }
    })

    root.addEventListener('keydown', (event) => {
      const input = event.target.closest('.combobox [data-sl-input-element]')
      if (!input) return

      const node = input.closest('.combobox')
      const isOpen = node.dataset.open === 'true'

      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault()
        if (!isOpen) openCombobox(node, true)
        moveComboboxActive(node, event.key === 'ArrowDown' ? 1 : -1)
        return
      }

      if (event.key === 'Enter' && isOpen) {
        event.preventDefault()
        const active = node.querySelector('[data-sl-select-item][data-active-item]')
        if (active) chooseComboboxValue(node, active.dataset.value)
        return
      }

      /* Esc fecha só a lista. Fechar a drawer junto tiraria o operador de onde
         ele está por causa de um gesto que era para desfazer a digitação. */
      if (event.key === 'Escape' && isOpen) {
        event.stopPropagation()
        openCombobox(node, false)
      }
    })
  }

  /* ── Formulário ──────────────────────────────────────────── */

  const sectionHeadHtml = (title, description) => `
    <div class="form-section-head">
      <h2 data-sl-heading data-variant="display3">${escapeHtml(title)}</h2>
      <p data-sl-text data-variant="body" class="form-section-description">${escapeHtml(description)}</p>
    </div>`

  function renderForm() {
    el('lot-form').innerHTML = `
      <section class="form-section">
        ${sectionHeadHtml('Sobre o lote', 'Identifique o lote e informe quando ele chega')}

        <div class="form-row" data-fluid="true">
          ${fieldHtml('form-name', 'Nome', inputHtml('form-name',
            `type="text" data-field="name" value="${escapeHtml(form.name)}"
             aria-describedby="form-name-description"`),
            { error: 'form-name', description: 'Ex.: Reposição de setembro' })}
        </div>

        <div class="form-row">
          ${fieldHtml('form-code', 'ID', inputHtml('form-code',
            `type="text" data-field="code" value="${escapeHtml(form.code)}"`),
            { error: 'form-code' })}
          ${fieldHtml('form-arrival', 'Data de chegada',
            datePickerHtml('form-arrival', 'arrival', form.arrivalDate, tomorrowIso()),
            { labelable: false, error: 'form-arrival' })}
        </div>
      </section>

      <section class="form-section">
        ${sectionHeadHtml('Produtos', 'Informe os SKUs e as quantidades que vão chegar neste lote')}

        <span data-sl-field-error role="alert" data-error-for="items" hidden></span>
        <div id="form-items"></div>
      </section>

      <section class="form-section">
        ${sectionHeadHtml('Destino', 'Defina em qual seller e estoque esses itens vão estar disponíveis')}
        <div class="form-row" id="form-destination"></div>
      </section>`

    renderDestination()
    renderItems()
  }

  /* Estoque depende do seller, então os dois são remontados juntos: trocar o
     seller limpa o estoque e repovoa a lista com os dele (FR-24). */
  function renderDestination() {
    el('form-destination').innerHTML = `
      ${fieldHtml('form-seller', 'Seller', comboboxHtml('form-seller', {
        kind: 'seller', value: form.seller || '', placeholder: 'Buscar seller',
      }), { error: 'form-seller' })}
      ${fieldHtml('form-warehouse', 'Estoque', comboboxHtml('form-warehouse', {
        kind: 'warehouse', value: form.warehouse || '',
        placeholder: form.seller ? 'Buscar estoque' : 'Escolha um seller primeiro',
        disabled: !form.seller,
      }), { error: 'form-warehouse' })}`

    if (form.seller) el('form-warehouse').focus()
  }

  /* ── Tabela de produtos ──────────────────────────────────── */

  const ITEM_COLUMNS = 'minmax(230px, 1fr) 140px 56px'

  function itemRowFormHtml(item) {
    return `
      <div data-sl-table-row data-selected="false">
        <div data-sl-table-cell>
          <div class="product-cell">
            ${productThumb(item)}
            <div class="cell-stack">
              <span class="lot-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
              <span class="cell-soft">SKU ID ${escapeHtml(item.skuId)}</span>
            </div>
          </div>
        </div>
        <div data-sl-table-cell class="num">
          <div data-sl-field data-space="normal" class="qty-cell">
            ${inputHtml(`qty-${item.skuId.replace('#', '')}`,
              `type="text" inputmode="numeric" data-digits data-qty="${escapeHtml(item.skuId)}"
               value="${escapeHtml(item.quantity)}" aria-label="Quantidade de ${escapeHtml(item.name)}"`)}
            <span data-sl-field-error role="alert" data-error-for="item:${escapeHtml(item.skuId)}" hidden></span>
          </div>
        </div>
        <div data-sl-table-cell>
          <button type="button" data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
                  data-remove-item="${escapeHtml(item.skuId)}"
                  aria-label="Remover ${escapeHtml(item.name)} do lote">
            <span data-sl-button-content>${TRASH}</span>
          </button>
        </div>
      </div>`
  }

  /* Até dez produtos a tabela é só a tabela. Do décimo primeiro em diante ela
     ganha a busca e a paginação da listagem: uma busca sobre três itens é
     mobília, e o Collection genérico do Figma é o componente saído da caixa. */
  const addProductsButtonHtml = `
    <button type="button" data-sl-button data-variant="secondary" data-size="normal" id="btn-add-products">
      <span data-sl-button-content>${icon('plus')}Adicionar produtos</span>
    </button>`

  function renderItems() {
    const host = el('form-items')
    const acao = `<div class="form-actions">${addProductsButtonHtml}</div>`

    /* Sem produtos, o botão é a seção inteira — é assim no Figma. A caixa só
       aparece quando há uma coleção para ela delimitar. */
    if (!form.items.length) {
      host.innerHTML = acao
      return
    }

    const paged = form.items.length > ITEMS_PAGE_SIZE
    const term = norm(itemsSearch.trim())
    const matched = term
      ? form.items.filter((item) => norm(`${item.name} ${item.skuId}`).includes(term))
      : form.items

    const pages = Math.max(1, Math.ceil(matched.length / ITEMS_PAGE_SIZE))
    itemsPage = Math.min(itemsPage, pages)
    const start = (itemsPage - 1) * ITEMS_PAGE_SIZE
    const visible = paged ? matched.slice(start, start + ITEMS_PAGE_SIZE) : matched

    const tools = paged ? `
      <div data-sl-collection-row>
        <div data-sl-search class="list-search">
          <span data-sl-pre-icon>${icon('magnifying-glass-small')}</span>
          <input data-sl-search-input id="items-search" placeholder="Buscar produto"
                 autocomplete="off" value="${escapeHtml(itemsSearch)}">
        </div>
        <div data-sl-pagination>
          <div data-sl-stack data-horizontal="true" style="--sl-stack-space: var(--sl-space-2)">
            <div data-sl-pagination-label data-loading="false">${
              matched.length <= ITEMS_PAGE_SIZE
                ? `${matched.length} de ${matched.length}`
                : `${start + 1} — ${Math.min(start + ITEMS_PAGE_SIZE, matched.length)} de ${matched.length}`
            }</div>
            <div data-sl-pagination-actions>
              <button type="button" data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
                      data-sl-pagination-action-prev data-items-page="-1" aria-label="Página anterior"
                      ${itemsPage === 1 ? 'disabled' : ''}>
                <span data-sl-button-content>${CARET_LEFT}</span>
              </button>
              <button type="button" data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
                      data-sl-pagination-action-next data-items-page="1" aria-label="Próxima página"
                      ${itemsPage >= pages ? 'disabled' : ''}>
                <span data-sl-button-content>${CARET_RIGHT}</span>
              </button>
            </div>
          </div>
        </div>
      </div>` : ''

    const body = visible.length
      ? visible.map(itemRowFormHtml).join('')
      : ''

    host.innerHTML = `
      ${acao}
      <div class="form-card">
        <div data-sl-collection>
          ${tools}
          <div class="form-card-viewport" data-more="false">
          <div class="form-card-scroll" data-fixed="${paged}">
            <div data-sl-table data-sl-table-density="default" data-sl-table-header-sticky="true"
                 style="--sl-table-grid-template-columns: ${ITEM_COLUMNS}">
              <div data-sl-table-header>
                <div data-sl-table-row>
                  <div data-sl-table-header-cell>Produto</div>
                  <div data-sl-table-header-cell class="num">Quantidade</div>
                  <div data-sl-table-header-cell></div>
                </div>
              </div>
              <div data-sl-table-body>${body}</div>
            </div>
            ${visible.length ? '' : `
              <div data-sl-collection-view>
                <div data-sl-empty-state data-sl-size="large">
                  <div data-sl-empty-state-container>
                    <div data-sl-empty-state-illustration data-sl-collection-view-illustration
                         style="color: var(--sl-color-gray-8)">${icon('magnifying-glass')}</div>
                    <h3 data-sl-heading data-variant="context" data-sl-collection-view-heading>Nenhum produto encontrado</h3>
                    <span data-sl-text data-variant="context" data-sl-collection-view-description>Tente outros termos</span>
                  </div>
                </div>
              </div>`}
          </div>
          </div>
          <div class="form-total">
            <span class="form-total-label">Total do lote</span>
            <span>${formTotal()} unidades</span>
          </div>
        </div>
      </div>`

    syncItemsFade()
  }

  /* O véu vive enquanto sobra conteúdo abaixo do visor; no fim da rolagem ele sai
     de cena para não sujar a última linha. */
  function syncItemsFade() {
    const scroll = el('form-items').querySelector('.form-card-scroll')
    if (!scroll) return

    const restante = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight
    scroll.closest('.form-card-viewport').dataset.more = String(restante > 1)
  }

  /* ── Drawer ──────────────────────────────────────────────── */

  const drawer = { open: false, rows: [] }
  let drawerRowSeq = 0
  let drawerReturnFocus = null

  const emptyRow = () => ({ id: `row-${(drawerRowSeq += 1)}`, skuId: null, quantity: '' })

  const drawerFilled = () => drawer.rows.some((row) => row.skuId || row.quantity)

  /* Toda linha aberta precisa estar completa: uma linha em branco no meio da
     drawer é trabalho por terminar, não um convite descartável. */
  function drawerErrors() {
    const errors = []

    for (const row of drawer.rows) {
      if (!row.skuId) errors.push({ field: `drawer-sku-${row.id}`, message: 'Escolha um produto' })

      if (row.quantity === '') {
        errors.push({ field: `drawer-qty-${row.id}`, message: 'Informe uma quantidade' })
      } else if (Number(row.quantity) < 1) {
        errors.push({ field: `drawer-qty-${row.id}`, message: 'A quantidade precisa ser 1 ou mais' })
      }
    }

    return errors
  }

  /* O botão fica desabilitado no aria, não no atributo: um botão desabilitado de
     verdade não recebe clique, e é o clique que mostra o que falta preencher. */
  const syncDrawerConfirm = () => {
    el('drawer-confirm').setAttribute('aria-disabled', String(drawerErrors().length > 0))
  }

  function drawerRowHtml(row, index) {
    const product = row.skuId ? productBySku(row.skuId) : null

    return `
      <div class="drawer-row" data-row="${row.id}">
        ${fieldHtml(`drawer-sku-${row.id}`, 'Produto', comboboxHtml(`drawer-sku-${row.id}`, {
          kind: 'sku', row: row.id, value: product ? product.name : '',
          placeholder: 'Buscar por nome ou SKU ID',
        }), { error: `drawer-sku-${row.id}` })}

        ${fieldHtml(`drawer-qty-${row.id}`, 'Quantidade', inputHtml(`drawer-qty-${row.id}`,
          `type="text" inputmode="numeric" data-digits data-drawer-qty="${row.id}"
           value="${escapeHtml(row.quantity)}"`), { error: `drawer-qty-${row.id}` })}

        ${drawer.rows.length === 1 ? '' : `
          <div class="drawer-row-remove">
            <button type="button" data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
                    data-remove-row="${row.id}" aria-label="Remover a linha ${index + 1}">
              <span data-sl-button-content>${TRASH}</span>
            </button>
          </div>`}
      </div>`
  }

  const renderDrawerRows = () => {
    el('drawer-rows').innerHTML = drawer.rows.map(drawerRowHtml).join('')
    syncDrawerConfirm()
  }

  function openDrawer() {
    drawerReturnFocus = document.activeElement
    drawer.open = true
    drawer.rows = [emptyRow()]
    renderDrawerRows()

    el('drawer').hidden = false
    /* Um quadro entre montar e animar: sem isso o painel nasce já no lugar e a
       transição não acontece. */
    requestAnimationFrame(() => { el('drawer').dataset.enter = 'true' })
    el('drawer').querySelector('[data-sl-input-element]').focus()
  }

  function closeDrawer({ force = false } = {}) {
    if (!force && drawerFilled()) {
      openConfirm({
        title: 'Descartar os produtos?',
        body: 'As linhas preenchidas não serão adicionadas ao lote.',
        confirmLabel: 'Descartar',
        onConfirm: () => closeDrawer({ force: true }),
      })
      return
    }

    closeAllComboboxes()
    drawer.open = false
    drawer.rows = []
    el('drawer').dataset.enter = 'false'
    el('drawer').hidden = true
    if (drawerReturnFocus) drawerReturnFocus.focus()
  }

  function commitDrawer() {
    clearErrors(el('drawer'))

    const errors = drawerErrors()

    if (errors.length) {
      for (const error of errors) paintError(error.field, error.message)
      el(errors[0].field).focus()
      return
    }

    for (const row of drawer.rows) {
      form.items.push({
        skuId: row.skuId,
        name: productBySku(row.skuId).name,
        quantity: row.quantity,
      })
    }

    closeDrawer({ force: true })
    paintError('items', '')
    renderItems()
  }

  /* ── Confirmação ─────────────────────────────────────────── */

  let confirmAction = null

  function openConfirm({ title, body, confirmLabel, onConfirm }) {
    el('discard-title').textContent = title
    el('discard-body').textContent = body
    el('discard-confirm-label').textContent = confirmLabel
    confirmAction = onConfirm

    el('discard-modal').hidden = false
    el('discard-confirm').focus()
  }

  function closeConfirm() {
    el('discard-modal').hidden = true
    confirmAction = null
  }

  /* ── Salvar ──────────────────────────────────────────────── */

  const bareCode = (code) => norm(String(code).replace('#', '').trim())

  function validateForm() {
    const errors = []

    if (!form.name.trim()) errors.push({ field: 'form-name', message: 'Informe o nome do lote' })

    const code = form.code.replace('#', '').trim()
    if (!code) errors.push({ field: 'form-code', message: 'Informe o ID do lote' })
    else if (LOTS.some((lot) => bareCode(lot.code) === bareCode(code))) {
      errors.push({ field: 'form-code', message: 'Já existe um lote com este ID' })
    }

    if (!form.arrivalDate) {
      errors.push({ field: 'form-arrival', message: 'Informe a data de chegada' })
    } else if (form.arrivalDate < tomorrowIso()) {
      errors.push({ field: 'form-arrival', message: 'A chegada precisa ser a partir de amanhã' })
    }

    if (!form.items.length) errors.push({ field: 'items', message: 'Adicione ao menos um produto' })

    for (const item of form.items) {
      const quantity = Number(item.quantity)
      if (item.quantity === '' || !Number.isInteger(quantity) || quantity < 1) {
        errors.push({ field: `item:${item.skuId}`, message: 'Informe uma quantidade de 1 ou mais' })
      }
    }

    // Sem seller, o estoque está desabilitado: cobrar os dois de uma vez marcaria
    // de vermelho um campo que o operador ainda não pode preencher.
    if (!form.seller) errors.push({ field: 'form-seller', message: 'Escolha o seller' })
    else if (!form.warehouse) errors.push({ field: 'form-warehouse', message: 'Escolha o estoque' })

    return errors
  }

  function saveLot() {
    clearErrors(el('screen-create'))

    const errors = validateForm()
    if (errors.length) {
      for (const error of errors) paintError(error.field, error.message)
      const target = focusTarget(errors[0].field)
      if (target) target.scrollIntoView({ block: 'center' })
      if (target) target.focus()
      return
    }

    const id = `lot-${LOTS.length + 1}`
    const code = `#${form.code.replace('#', '').trim()}`

    LOTS.push({
      id,
      code,
      name: form.name.trim(),
      destination: DESTINATIONS.find(
        (d) => d.seller === form.seller && d.warehouse === form.warehouse),
      arrivalDate: form.arrivalDate,
      /* O formulário só produz lote agendado: recebido, cancelado e inativo são
         transições da vida do lote, não estados de nascimento (INV-6). */
      status: 'scheduled',
      items: form.items.map((item, index) => ({
        id: `${id}-item-${index + 1}`,
        skuId: item.skuId,
        name: item.name,
        quantity: Number(item.quantity),
      })),
    })

    SKU_ROWS = buildSkuRows(LOTS)

    /* A listagem volta à primeira página: ordenada por chegada, o lote recém-criado
       entra pela data dele, e quem estava numa página do meio não o veria. */
    state.page = 1

    formPristine = snapshot()
    goTo(ROUTES.listing)
    render()
    showToast(`Lote ${code} criado`)
  }

  function resetForm() {
    form.name = ''
    form.code = nextCode()
    form.arrivalDate = null
    form.items = []
    form.seller = null
    form.warehouse = null
    itemsSearch = ''
    itemsPage = 1

    renderForm()
    formPristine = snapshot()
  }

  /* Sair só pergunta quando há o que perder. Um formulário intocado — o ID
     sugerido e nada mais — sai calado. */
  function requestLeave() {
    if (snapshot() === formPristine) {
      goTo(ROUTES.listing)
      return
    }

    openConfirm({
      title: 'Descartar o lote?',
      body: 'O que você preencheu não será salvo.',
      confirmLabel: 'Descartar',
      onConfirm: () => {
        closeConfirm()
        formPristine = snapshot()
        goTo(ROUTES.listing)
      },
    })
  }

  /* ── Toast ───────────────────────────────────────────────── */

  const TOAST_MS = 6000
  let toastTimer = null

  /* Posição bottom-right, que é a padrão do ToastStack. O componente calcula o
     deslocamento vertical de cada toast empilhado; aqui só existe um por vez. */
  function showToast(message) {
    const stack = el('toast-stack')
    stack.innerHTML = `
      <div data-sl-toast-appear data-visible="false"
           style="bottom: 0; justify-content: flex-end; --sl-toast-index: 0">
        <div data-sl-toast data-variant="success">
          <div data-sl-toast-icon-container>${icon('check-circle-fill')}</div>
          <div data-sl-toast-container>${escapeHtml(message)}</div>
          <div data-sl-toast-actions>
            <div data-sl-bleed>
              <div data-sl-bleed-content style="--sl-bleed-top: var(--sl-space-2); --sl-bleed-end: var(--sl-space-2); --sl-bleed-bottom: var(--sl-space-2)">
                <button type="button" data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
                        id="toast-dismiss" aria-label="Fechar aviso">
                  <span data-sl-button-content>${icon('x')}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>`

    const node = stack.firstElementChild
    requestAnimationFrame(() => { node.dataset.visible = 'true' })

    el('toast-dismiss').addEventListener('click', hideToast)
    clearTimeout(toastTimer)
    toastTimer = setTimeout(hideToast, TOAST_MS)
  }

  function hideToast() {
    const node = el('toast-stack').firstElementChild
    if (!node) return
    node.dataset.visible = 'false'
    setTimeout(() => { el('toast-stack').innerHTML = '' }, 250)
  }

  /* ── Eventos da tela de criação ──────────────────────────── */

  el('btn-create').addEventListener('click', () => goTo(ROUTES.create))
  el('btn-back').addEventListener('click', requestLeave)
  el('btn-cancel').addEventListener('click', requestLeave)
  el('btn-save').addEventListener('click', saveLot)

  bindComboboxes(el('screen-create'))
  bindComboboxes(el('drawer'))
  bindDateSegments(el('screen-create'))
  bindDigitsOnly(el('screen-create'), '[data-digits]')
  bindDigitsOnly(el('drawer'), '[data-digits]')

  /* Campos de texto escrevem no estado sem remontar nada: remontar apagaria o
     cursor de quem está digitando. Só a quantidade tem eco na tela — o total. */
  el('lot-form').addEventListener('input', (event) => {
    const field = event.target.closest('[data-field]')
    if (field) {
      form[field.dataset.field] = field.value
      paintError(field.id, '')
      return
    }

    const quantity = event.target.closest('[data-qty]')
    if (quantity) {
      const item = form.items.find((i) => i.skuId === quantity.dataset.qty)
      item.quantity = quantity.value
      paintError(`item:${item.skuId}`, '')
      el('lot-form').querySelector('.form-total span:last-child').textContent =
        `${formTotal()} unidades`
      return
    }

    const search = event.target.closest('#items-search')
    if (search) {
      itemsSearch = search.value
      itemsPage = 1
      renderItems()
      el('items-search').focus()
      el('items-search').setSelectionRange(search.value.length, search.value.length)
    }
  })

  el('lot-form').addEventListener('click', (event) => {
    if (event.target.closest('#btn-add-products')) {
      openDrawer()
      return
    }

    const remove = event.target.closest('[data-remove-item]')
    if (remove) {
      form.items = form.items.filter((item) => item.skuId !== remove.dataset.removeItem)
      renderItems()
      return
    }

    const page = event.target.closest('[data-items-page]')
    if (page) {
      itemsPage += Number(page.dataset.itemsPage)
      renderItems()
      return
    }

    /* Calendário da data de chegada: mesma interação do filtro de chegada. */
    const picker = event.target.closest('[data-sl-date-picker]')
    if (!picker) {
      closeAllCalendars()
      return
    }

    if (event.target.closest('[data-sl-date-picker-button]')) {
      openCalendar(picker, picker.dataset.open !== 'true')
      return
    }

    const nav = event.target.closest('[data-calendar-nav]')
    if (nav) {
      shiftCalendarMonth(picker.querySelector('.calendar-popover'),
        nav.dataset.calendarNav === 'prev' ? -1 : 1)
      return
    }

    const cell = event.target.closest('[data-sl-calendar-cell-button]')
    if (cell) {
      setPickerDate(picker, cell.dataset.date)
      openCalendar(picker, false)
      return
    }

    if (!event.target.closest('[data-segment]')) segmentOf(picker, 'day').focus()
  })

  /* O valor da data vem do input escondido do DatePicker, que os segmentos
     mantêm em ISO — é o mesmo caminho que o filtro usa para ler o campo. */
  el('lot-form').addEventListener('sl-date-change', (event) => {
    form.arrivalDate = hiddenOf(event.target).value || null
    if (form.arrivalDate) paintError('form-arrival', '')
  })

  el('drawer').addEventListener('click', (event) => {
    if (event.target.closest('[data-role="drawer-close"]')) {
      closeDrawer()
      return
    }

    if (event.target.closest('#drawer-add-row')) {
      drawer.rows.push(emptyRow())
      renderDrawerRows()
      const rows = el('drawer-rows').querySelectorAll('.drawer-row')
      rows[rows.length - 1].querySelector('[data-sl-input-element]').focus()
      return
    }

    /* O botão desabilitado continua clicável de propósito: é o clique que pinta
       as mensagens do que falta, e o commitDrawer já faz isso quando há erro. */
    if (event.target.closest('#drawer-confirm')) {
      commitDrawer()
      return
    }

    const remove = event.target.closest('[data-remove-row]')
    if (remove) {
      drawer.rows = drawer.rows.filter((row) => row.id !== remove.dataset.removeRow)
      renderDrawerRows()
    }
  })

  el('drawer').addEventListener('input', (event) => {
    const quantity = event.target.closest('[data-drawer-qty]')
    if (!quantity) return

    const row = drawer.rows.find((r) => r.id === quantity.dataset.drawerQty)
    row.quantity = quantity.value
    paintError(`drawer-qty-${row.id}`, '')
    syncDrawerConfirm()
  })

  /* Foco preso enquanto a drawer está aberta: sem isso o Tab sairia para a
     página atrás dela, que continua montada. */
  el('drawer').addEventListener('keydown', (event) => {
    if (event.key !== 'Tab') return

    const focusable = [...el('drawer-panel').querySelectorAll(
      'button:not([disabled]), input:not([disabled]), [tabindex="0"]')]
      .filter((node) => node.offsetParent !== null)

    if (!focusable.length) return

    const first = focusable[0]
    const last = focusable[focusable.length - 1]

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault()
      last.focus()
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault()
      first.focus()
    }
  })

  el('discard-modal').addEventListener('click', (event) => {
    if (event.target.closest('[data-role="discard-cancel"]')) {
      closeConfirm()
      return
    }

    if (event.target.closest('#discard-confirm') && confirmAction) {
      const action = confirmAction
      closeConfirm()
      action()
    }
  })

  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return

    if (!el('discard-modal').hidden) {
      closeConfirm()
      return
    }

    if (drawer.open) {
      closeDrawer()
      return
    }

    closeAllComboboxes()
  })

  /* Rolagem não borbulha, então o listener é de captura. */
  document.addEventListener('scroll', (event) => {
    if (event.target.classList && event.target.classList.contains('form-card-scroll')) syncItemsFade()
  }, true)

  /* Clique fora fecha a lista do combobox e, se estiver aberta, a drawer — que
     no Shoreline não tem fundo escurecido e é dispensável por clique fora. */
  document.addEventListener('mousedown', (event) => {
    if (!event.target.closest('.combobox')) closeAllComboboxes()

    if (!drawer.open) return
    if (!el('discard-modal').hidden) return
    if (event.target.closest('#drawer-panel')) return
    if (event.target.closest('#btn-add-products')) return

    closeDrawer()
  })

  /* ── Shell: recolher a navegação ─────────────────────────── */

  const menuButton = document.getElementById('btn-menu')

  menuButton.addEventListener('click', () => {
    const isCollapsed = document.querySelector('.shell').classList.toggle('nav-collapsed')
    menuButton.setAttribute('aria-expanded', String(!isCollapsed))
  })

  /* Skeleton é um estado real da tela; um atraso curto o torna visível na revisão. */
  hydrateIcons()
  buildFilterBodies()
  renderTableHead()
  render()
  handleRoute()
  setTimeout(() => {
    state.isLoading = false
    render()
  }, 450)
})()
</script>

</body>
</html>
