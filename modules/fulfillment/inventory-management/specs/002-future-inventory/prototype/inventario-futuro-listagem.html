<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário futuro — Listagem (protótipo)</title>

<!--
  Protótipo da listagem do módulo Inventário futuro, nas duas granularidades:
  por lote e por SKU.

  Fidelidade visual vem do CSS real do Shoreline, carregado do unpkg com a
  versão pinada. A estilização do Shoreline é feita por seletores de atributo
  (data-sl-*), então funciona em HTML estático, sem React e sem build.

  A versão está pinada porque os atributos data-sl-* não são API pública
  documentada para escrita manual: uma atualização do Shoreline pode mudá-los.
-->
<link rel="stylesheet" href="https://unpkg.com/@vtex/shoreline@1.12.13/dist/themes/sunrise/styles.css">

<!--
  O token --sl-font-family-sans pede Inter, mas o Shoreline não empacota o
  webfont: no Admin real quem carrega a fonte é o shell. Sem isto o protótipo
  cai no fallback do sistema e muda de aparência em cada máquina — só quem tem
  Inter instalado localmente veria o resultado certo.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
  /* ─────────────────────────────────────────────────────────────
     Cromo do Admin (topbar e sidebar).
     Não existe componente Shoreline para isso, então é CSS próprio —
     mas todo valor vem de token --sl-*. Portado do shell mockado em React.
     ───────────────────────────────────────────────────────────── */

  /* O reset do Shoreline manda os controles herdarem a fonte
     (input, button { font: inherit }) e o base.css só define cor e fundo do
     body — a família de fonte fica por conta da aplicação. Sem declarar aqui,
     todo o cromo do Admin herda a serifada padrão do navegador. */
  body { margin: 0; font-family: var(--sl-font-family-sans); }

  .shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* No Figma a barra tem 60px: 36px de conteúdo mais 12px de padding em cima e
     embaixo. min-height em vez de height deixa a borda de baixo ficar fora dos
     60px, como no desenho, em vez de comer 1px do conteúdo. */
  .topbar {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    gap: var(--sl-space-4);
    min-height: 60px; padding: var(--sl-space-3);
    background: var(--sl-bg-base);
    border-bottom: var(--sl-border-base);
  }
  .topbar-start { display: flex; align-items: center; gap: var(--sl-space-2); flex: 1; min-width: 0; }
  .topbar-center { display: flex; justify-content: center; flex: 0 1 400px; min-width: 0; }
  .topbar-end { display: flex; align-items: center; justify-content: flex-end; gap: var(--sl-space-1); flex: 1; min-width: 0; }

  /* Os botões da barra são Button e IconButton tertiary de verdade: altura,
     padding, raio, texto em text-action e estados de hover vêm todos do
     Shoreline. A única regra que a topbar dispensa é o min-width de 100px do
     Button — no Figma "Help" tem 75px, ou seja, largura do conteúdo. */
  .topbar [data-sl-button] { min-width: auto; }

  .logo-account { display: flex; align-items: center; gap: var(--sl-space-1); height: 36px; }
  .logo {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px; border-radius: var(--sl-radius-2);
  }
  .account {
    display: flex; align-items: center; height: 36px;
    padding: 0 var(--sl-space-3); border-radius: var(--sl-radius-2);
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
    color: var(--sl-fg-base); white-space: nowrap;
  }

  /* 400x36 no Figma, fundo bg-muted (5% de cinza sobre o branco) e o texto de
     apoio em text-action, não em text-body. */
  .topbar-search {
    display: flex; align-items: center; justify-content: center; gap: var(--sl-space-2);
    width: 100%; max-width: 400px; height: 36px;
    padding: var(--sl-space-2) var(--sl-space-3);
    background: var(--sl-bg-muted); border-radius: var(--sl-radius-2);
    color: var(--sl-fg-muted); cursor: text;
    font: var(--sl-text-action-font); letter-spacing: var(--sl-text-action-letter-spacing);
    white-space: nowrap;
  }
  /* Sem width/height: cada ícone fica no tamanho para o qual foi desenhado —
     20px no Normal, 16px no Small. Como o traço é non-scaling-stroke, encolher
     um ícone de 20 para 16 mantém 1,5px de traço sobre um desenho menor, o que
     muda o peso aparente e tira os detalhes da grade de pixels. */
  .topbar-search svg { flex-shrink: 0; }

  /* A caixa de 36px alinha o avatar com os botões vizinhos; o círculo de 24px é
     o avatar em si. O Figma aponta direto para color-blue-3 e color-blue-10. */
  .avatar {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px;
  }
  .avatar-initial {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: var(--sl-radius-full);
    background: var(--sl-color-blue-3); color: var(--sl-color-blue-10);
    font: var(--sl-text-action-font); letter-spacing: var(--sl-text-action-letter-spacing);
  }

  .body { display: flex; flex: 1; min-height: 0; }

  /* 280px é a largura total, borda inclusa: box-sizing: border-box vem do reset
     do Shoreline. Os 20px de padding no topo colocam o primeiro item a 20px da
     borda do container, e os 20px na lateral é o que recua a pílula do item
     selecionado, deixando as linhas com 240px. */
  .sidebar {
    display: flex; flex-direction: column; flex-shrink: 0;
    width: 280px;
    padding: var(--sl-space-5) var(--sl-space-5) var(--sl-space-6);
    background: var(--sl-bg-base-soft);
    border-right: var(--sl-border-base);
    overflow-x: hidden; overflow-y: auto;
    transition: width 180ms ease, border-right-width 180ms ease, padding 180ms ease;
  }

  /* Em coluna flex, todo filho encolhe por padrão quando a lista não cabe. Sem
     travar isso, os itens perdem altura em telas mais baixas — 34px viravam
     30,14px numa janela de 760px — e a nav sai da grade de 4px. Quem cede
     espaço tem de ser a rolagem da sidebar, não a altura dos itens. */
  .sidebar > * { flex-shrink: 0; }

  /* Recolhida pelo hamburger: o Admin esconde a navegação inteira e o
     conteúdo assume a largura toda. box-sizing: border-box vem do reset do
     Shoreline, então os itens colapsam junto com o padding. */
  /* O padding lateral também zera: com box-sizing: border-box, width 0 ainda
     deixaria os 40px de padding ocupando espaço. */
  .nav-collapsed .sidebar { width: 0; padding-left: 0; padding-right: 0; border-right-width: 0; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--sl-color-gray-4); border-radius: var(--sl-radius-full); }

  /* Área de 36px no item e no sub-item. Os tokens de texto trazem 14px/20px:
     13px não existe na escala do Shoreline, que só tem 12, 14, 16, 20 e 24px.

     O raio de 6px não é token do Shoreline — fica entre radius-1 (4px) e
     radius-2 (8px) — mas é o que o Figma usa: calibrei o avanço do canto do
     print contra pílulas de 4, 6, 8 e 12px, e só o de 6px bate. */
  .nav-item, .nav-sub-item {
    display: flex; align-items: center;
    width: 100%; height: 36px;
    border: none; border-radius: 6px; background: transparent;
    font: var(--sl-text-body-font); letter-spacing: var(--sl-text-body-letter-spacing);
    color: var(--sl-fg-muted); text-align: left; cursor: pointer;
  }
  /* Sobre uma superfície soft, gray-1 de hover seria invisível: é a mesma cor do
     fundo. O hover neutro do Shoreline é uma camada de gray-12 a 5%, que escurece
     qualquer superfície por baixo. */
  .nav-item:hover, .nav-sub-item:hover {
    background: var(--sl-bg-muted-plain-hover); color: var(--sl-fg-muted-hover);
  }

  /* O ícone encosta na borda esquerda da linha, e o rótulo começa 20px depois
     dele: é o que o print mostra, ícone a 20px da borda da nav e rótulo a 60px.
     Os 4px à direita são o respiro do caret. Os 4px de baixo são a folga entre
     itens — o passo do print é 40px no item e 36px no sub-item, que é contíguo. */
  .nav-item {
    gap: var(--sl-space-5);
    padding-right: var(--sl-space-1);
    margin-bottom: var(--sl-space-1);
  }
  /* O ícone herda a cor do item, então acompanha o hover junto com o rótulo. */
  .nav-item svg { flex-shrink: 0; }
  .nav-item-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item-expanded .nav-item-label {
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
    color: var(--sl-fg-base);
  }
  .caret { display: flex; align-items: center; color: var(--sl-fg-base-soft); }

  /* 40px = os 20px do ícone mais os 20px de gap, para o sub-item alinhar com o
     rótulo do item. No print os dois nascem no mesmo x. */
  .nav-sub-item {
    padding: 0 var(--sl-space-1) 0 40px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* O item selecionado é uma pílula recuada 20px de cada lado, o que vem do
     padding da própria sidebar. A cor medida no print é #eaeaea, que é
     exatamente gray-12 a 5% sobre a superfície soft — ou seja, a camada que o
     Shoreline chama de hover, não de pressed. Mantenho o valor do Figma e uso a
     camada de 10% no hover, senão passar o mouse no item ativo não daria
     retorno nenhum. */
  .nav-sub-item-active {
    background: var(--sl-bg-muted-plain-hover); color: var(--sl-fg-accent);
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
  }
  .nav-sub-item-active:hover {
    background: var(--sl-bg-muted-plain-pressed); color: var(--sl-fg-accent);
  }

  /* 20px acima e 8px abaixo, alinhado com os sub-itens: no print o bloco do
     rótulo ocupa 44px entre a última linha de um grupo e a primeira do outro. */
  .nav-group-label {
    padding: var(--sl-space-5) 0 var(--sl-space-2) 40px;
    font: var(--sl-text-caption-1-font); letter-spacing: var(--sl-text-caption-1-letter-spacing);
    color: var(--sl-fg-base-soft);
  }

  /* Respiro entre grupos: no print são 24px entre a última linha do grupo
     "Inventário" e o item seguinte, que é o respiro de 20px mais os 4px de folga
     que todo item já carrega. Um sub-item não tem folga embaixo, então aqui os
     24px vêm inteiros deste margin. */
  .nav-item-group-start { margin-top: var(--sl-space-6); }

  .content { flex: 1; min-width: 0; overflow-y: auto; background: var(--sl-bg-base); }

  /* O padding do cabeçalho vem do Container + Content do próprio Shoreline
     (ver a marcação de [data-sl-page-header-container]), não de regra própria. */

  /* ─────────────────────────────────────────────────────────────
     Layout da listagem
     ───────────────────────────────────────────────────────────── */

  /* Busca, filtros, tabela e paginação vivem dentro de [data-sl-collection] e
     [data-sl-collection-row], que são os contêineres oficiais da listagem: uma
     pilha vertical com gap e linhas flex. Nenhum dos dois tem borda, fundo ou
     raio — a tabela do Admin não é um cartão. */

  /* A busca encolhe antes da paginação: o Shoreline não impede o rótulo
     "1 — 25 de 74" de quebrar, então quem cede espaço é o campo de busca. */
  .toolbar-end { display: flex; align-items: center; gap: var(--sl-space-5); flex-shrink: 0; }
  .list-search { flex: 1 1 300px; min-width: 200px; max-width: 340px; }

  /* Dois botões, não Tab: Tab pressupõe um painel montado por aba e estado
     próprio de cada painel, e as duas visões compartilham de propósito a mesma
     busca, os mesmos filtros e a mesma paginação. */
  .segmented { display: flex; gap: var(--sl-space-1); }

  /* Posicionamento do popover é responsabilidade do React Aria no Shoreline.
     Em HTML estático, faço à mão — a aparência continua vindo do CSS oficial. */
  .filter { position: relative; }
  .filter-popover { position: absolute; top: calc(100% + var(--sl-space-2)); left: 0; display: none; }
  .filter[data-open="true"] .filter-popover { display: block; }

  /* Mesma ancoragem à mão para o Calendar que o DatePicker abre. Ele fica com a
     largura que os sete dias pedem, então é mais largo que o popover de filtro e
     sobra para a direita — é o mesmo bottom-start do componente, que também não
     se limita à largura do campo. O min-width de 320px do DatePicker não caberia
     nos 260px do popover; ele é custom property justamente para ser ajustado. */
  .date-picker { position: relative; width: 100%; }
  .date-picker [data-sl-date-picker-input] { --sl-datepicker-min-width: 0; }
  .calendar-popover { position: absolute; top: calc(100% + var(--sl-space-2)); left: 0; display: none; }
  .date-picker[data-open="true"] .calendar-popover { display: block; }

  /* Mesma ancoragem à mão para o ContextualHelp do cabeçalho "Destino". No
     Shoreline o popover é levado para o body por portal, então nunca herda o
     white-space: nowrap da célula de cabeçalho — aqui ele é filho da célula, e
     sem desfazer o nowrap o texto sairia numa linha só. */
  .header-help { position: relative; display: flex; }
  .header-help-popover {
    position: absolute; top: calc(100% + var(--sl-space-2)); left: 0;
    display: none; white-space: normal;
  }
  .header-help[data-open="true"] .header-help-popover { display: block; }

  /* Intervalo de data e de quantidade não são FilterItem: o Filter do Shoreline
     não tem primitiva para intervalo. Nosso aqui é só o arranjo em par — cada
     campo é Field + Label + Input, os dois empilhados num Stack, e o aviso de
     intervalo invertido é um FieldError. Nada disso precisa de CSS local. As
     listas de opção usam data-sl-filter-list e data-sl-filter-item. */

  /* Desvio deliberado do CSS que o Shoreline publica hoje: o hover do item
     responde no tipo do item, não na linha. Num item de múltipla escolha quem
     reage é a caixa, com os mesmos estados do Checkbox. O CSS do Filter mostra
     essa migração pela metade — ele declara o fundo de pressed e de item ativo
     e, três regras abaixo, desfaz os dois, deixando só o hover da linha para
     trás. Como o <style> daqui está fora de @layer, ele vence a camada
     sl-components sem precisar de especificidade extra. */
  [data-sl-filter-item]:hover,
  [data-sl-filter-item]:active {
    background: var(--sl-bg-muted-plain);
    color: var(--sl-fg-base);
  }
  [data-sl-filter-item]:hover [data-sl-filter-item-check] {
    border: var(--sl-border-base-strong-hover);
  }
  /* Marcada, a caixa fica coberta pelo indicador, que esconde a borda sob um
     anel de 1px da própria cor de fundo. Por isso o anel acompanha o fundo em
     cada estado, senão a borda antiga reapareceria por baixo. */
  [data-sl-filter-item]:hover [data-sl-filter-item-check-indicator] {
    background: var(--sl-bg-accent-strong-hover);
    box-shadow: 0 0 0 var(--sl-filter-item-check-border-width) var(--sl-bg-accent-strong-hover);
  }
  [data-sl-filter-item]:active [data-sl-filter-item-check-indicator] {
    background: var(--sl-bg-accent-strong-pressed);
    box-shadow: 0 0 0 var(--sl-filter-item-check-border-width) var(--sl-bg-accent-strong-pressed);
  }

  /* Rodapé de carregamento da lista de destinos. O Shoreline não tem esse
     elemento porque não tem scroll infinito em filtro; o spinner é dele. */
  .filter-list-more {
    display: flex;
    justify-content: center;
    padding: var(--sl-space-3) var(--sl-space-0);
    color: var(--sl-fg-base-soft);
  }

  /* 20px da primeira linha + 4px de gap + 16px da segunda = 40px, que com os
     12px de padding da densidade default fecham a linha de 64px do Shoreline. */
  .cell-stack { display: flex; flex-direction: column; gap: var(--sl-space-1); min-width: 0; }
  .cell-soft { font: var(--sl-text-caption-1-font); color: var(--sl-fg-base-soft); }
  .num { justify-content: flex-end; text-align: right; }
  .muted { color: var(--sl-fg-base-soft); }

  /* 16px entre as colunas da direita. A densidade default do Shoreline aplica
     12px nos quatro lados, e o vão entre dois conteúdos é a soma dos paddings
     vizinhos: 24px. Para chegar a 16px, o grupo da direita usa 8px na lateral.
     O padding vertical continua em 12px, que é o que sustenta a linha de 64px. */
  [data-sl-table] [data-sl-table-cell]:nth-child(n + 2),
  [data-sl-table] [data-sl-table-header-cell]:nth-child(n + 2) {
    padding-left: var(--sl-space-2);
    padding-right: var(--sl-space-2);
  }
  /* A borda externa fica nos 12px da densidade, senão o menu de cada linha sai
     do alinhamento com a paginação e com o cabeçalho da página. */
  [data-sl-table] [data-sl-table-cell]:last-child,
  [data-sl-table] [data-sl-table-header-cell]:last-child {
    padding-right: var(--sl-space-3);
  }

  .lot-cell { display: flex; align-items: center; gap: var(--sl-space-2); min-width: 0; }
  .lot-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* O botão de expandir é o IconButton do Shoreline, sem CSS próprio: os estados
     de hover, pressed, foco e desabilitado vêm da variante tertiary. */

  /* Miniatura mais pilha de texto: a mesma célula na linha filha da visão por
     lote e na linha da visão por SKU. */
  .sku-cell, .product-cell { display: flex; align-items: center; gap: var(--sl-space-3); min-width: 0; }

  /* Só a linha filha recua: 28px levam o SKU até depois do botão de expandir do
     lote, que tem 36px e, com o Bleed de -8px de cada lado, deixa 20px na
     célula, mais o gap de 8px. A visão por SKU não tem botão de expandir. */
  .sku-cell { padding-left: 28px; }
  .sku-thumb {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px; border-radius: var(--sl-radius-2);
    background: var(--sl-bg-base); border: 1px solid var(--sl-border-base);
    color: var(--sl-fg-base-soft);
  }

  /* O Figma desenha a imagem do produto em 44px, o que somado aos 12px de
     padding da densidade default daria uma linha de 68px. 40px é o maior
     quadro que fecha exatamente os 64px que a Table prescreve. */
  .product-thumb {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: var(--sl-radius-2);
    background: var(--sl-bg-base); border: 1px solid var(--sl-border-base);
    color: var(--sl-fg-base-soft);
  }
  .product-thumb svg,
  .sku-thumb svg { display: block; }

  .row-child [data-sl-table-cell] { background: var(--sl-bg-base-soft); }

  /* Fora do Shoreline: o Figma trata lote aberto e seus SKUs como um bloco só.
     Por isso a linha do lote perde a borda de baixo quando está aberta, e a
     última filha fecha o bloco só com o arredondamento e o fundo cinza, sem
     borda — a mudança de cor já demarca onde o bloco termina.
     As linhas são display: contents, então o raio vai nas células das pontas. */
  [data-sl-table-row][data-expanded="true"] > [data-sl-table-cell],
  .row-child-last > [data-sl-table-cell] { border-bottom: none; }

  .row-child-last > [data-sl-table-cell]:first-child { border-bottom-left-radius: 12px; }
  .row-child-last > [data-sl-table-cell]:last-child { border-bottom-right-radius: 12px; }

  /* ─────────────────────────────────────────────────────────────
     Criação de lote
     ───────────────────────────────────────────────────────────── */

  /* O atributo hidden só vale display: none pela folha do agente, que perde para
     qualquer regra de autor. Como as duas telas são [data-sl-page] — e o
     Shoreline dá display: flex a elas —, esconder pelo atributo não bastaria. */
  [hidden] { display: none !important; }

  /* A tela de criação não tem navegação lateral, como o frame do Figma: é uma
     tarefa focada, e a saída são o voltar e as duas ações do cabeçalho. */
  .shell[data-screen="create"] .sidebar { display: none; }

  .page-title-back { display: flex; align-items: center; gap: var(--sl-space-2); min-width: 0; }

  /* 720px é a coluna do Figma; 64px, o vão entre as seções. */
  .lot-form {
    width: 720px; max-width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; gap: var(--sl-space-16);
  }

  .form-section { display: flex; flex-direction: column; gap: var(--sl-space-5); }
  .form-section-head { display: flex; flex-direction: column; gap: var(--sl-space-1); }
  .form-section-description { color: var(--sl-fg-base-soft); }

  /* O Field é inline-flex com min-width: fit-content — sozinho ele fica do
     tamanho do rótulo. Quem dá a largura é o arranjo, não o componente. */
  .form-row { display: flex; gap: var(--sl-space-5); }
  .form-row > [data-sl-field] { width: 350px; flex: 0 0 350px; }
  .form-row[data-fluid="true"] > [data-sl-field] { width: auto; flex: 1 1 auto; min-width: 0; }

  .form-actions { display: flex; }
  #form-items { display: flex; flex-direction: column; gap: var(--sl-space-5); }

  /* Esta versão do Shoreline não tem um Card, então a caixa que isola a coleção
     de produtos é montada com os tokens do próprio sistema. */
  .form-card {
    padding: var(--sl-space-4);
    border: var(--sl-border-base); border-radius: var(--sl-radius-3);
    background: var(--sl-bg-base);
  }
  /* Cinco linhas e meia no visor e o resto por rolagem: a linha cortada ao meio já
     diz que a lista continua, e com altura fixa virar a página não faz a tela
     crescer e encolher. O cabeçalho fica preso no topo pelo
     data-sl-table-header-sticky do próprio componente. */
  .form-card-scroll {
    /* Medidos no navegador: o cabeçalho fecha em 45px e a linha em 69px — o Input
       de 44px da quantidade mais o padding da densidade default e a borda. */
    --altura-cabecalho: 45px;
    --altura-linha: 69px;
    --linhas-no-visor: 5.5;
    max-height: calc(var(--altura-cabecalho) + var(--linhas-no-visor) * var(--altura-linha));
    overflow-y: auto;
  }
  /* Só quando há paginação: numa lista curta a altura fixa deixaria um vão. */
  .form-card-scroll[data-fixed="true"] {
    height: calc(var(--altura-cabecalho) + var(--linhas-no-visor) * var(--altura-linha));
  }

  /* O véu na borda de baixo é a outra metade da pista: aparece só enquanto há
     conteúdo abaixo do visor e não intercepta clique nenhum. */
  .form-card-viewport { position: relative; }
  .form-card-viewport::after {
    /* Da altura da meia linha, para o véu não alcançar a linha inteira acima. */
    content: ''; position: absolute; inset: auto 0 0 0; height: 32px;
    background: linear-gradient(to top, var(--sl-bg-base), transparent);
    opacity: 0; transition: opacity 160ms ease; pointer-events: none;
  }
  .form-card-viewport[data-more="true"]::after { opacity: 1; }

  /* A soma das quantidades fecha a seção de produtos, alinhada à direita como a
     coluna que ela resume. */
  .form-total {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: var(--sl-space-3);
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
  }
  .form-total-label { color: var(--sl-fg-base-soft); font: var(--sl-text-body-font); }

  /* Quantidade editável na célula: o Input do Shoreline em 44px dentro de uma
     linha de 64px, com a largura do maior número que a fixture produz. */
  .qty-cell { width: 96px; margin-left: auto; }

  /* ── Combobox ────────────────────────────────────────────────
     O Combobox desta versão do Shoreline é um invólucro do Ariakit sem CSS
     próprio: dos quatro atributos que ele emite, só [data-sl-combobox-list]
     é estilizado, e mesmo assim junto com o Filter. Por isso a composição
     daqui empresta as peças que têm desenho — o Input no gatilho e o popover,
     os itens e a marca de escolhido do Select, que é o irmão de escolha única
     e já traz item ativo, item desabilitado e a altura máxima da lista. */
  .combobox { position: relative; }
  .combobox-caret {
    display: flex; align-items: center; flex-shrink: 0;
    padding-right: var(--sl-space-4); color: var(--sl-fg-base-soft);
    pointer-events: none;
  }
  .combobox [data-sl-input][data-disabled="true"] .combobox-caret { color: var(--sl-fg-base-disabled); }
  .combobox-popover {
    position: absolute; top: calc(100% + var(--sl-space-1)); left: 0; right: 0;
    display: none; z-index: var(--sl-z-6);
  }
  .combobox[data-open="true"] .combobox-popover { display: flex; }
  .combobox-empty {
    padding: var(--sl-space-2) var(--sl-space-3);
    color: var(--sl-fg-base-soft);
  }
  /* O popover do Select acompanha a largura do gatilho — é o sameWidth do
     componente. Num campo estreito, nome e SKU ID lado a lado se apertavam, então
     o SKU desce para uma segunda linha, como legenda. */
  .combobox-item-text {
    display: flex; flex-direction: column; min-width: 0;
    gap: var(--sl-space-05);
  }
  /* Nome numa linha só, com reticências: nomes de SKU são longos e, quebrados,
     faziam a lista crescer para o dobro da altura de um item do Select. */
  .combobox-item-text > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* O motivo de um item desabilitado fica na própria linha: some da lista quem
     já está no lote seria dizer que o SKU não existe. */
  .combobox-reason {
    margin-left: auto; padding-left: var(--sl-space-3); flex-shrink: 0;
    font: var(--sl-text-caption-1-font); white-space: nowrap;
  }

  /* ── Drawer e modal ──────────────────────────────────────────
     Posicionar é responsabilidade do Vaul e do Ariakit no Shoreline; em HTML
     estático faço à mão, e o desenho continua vindo do CSS oficial. */
  .drawer-root [data-sl-drawer-popover] { transition: translate 220ms ease; }
  .drawer-root[data-enter="false"] [data-sl-drawer-popover] { translate: 100% 0; }

  .drawer-rows { display: flex; flex-direction: column; gap: var(--sl-space-4); }
  /* Cada par produto + quantidade é uma caixa: com várias linhas na tela, é ela
     que diz onde um item termina e o outro começa. O fundo sozinho já demarca —
     a borda em volta era desenho a mais. */
  .drawer-row {
    display: flex; align-items: flex-start; gap: var(--sl-space-3);
    padding: var(--sl-space-4);
    border-radius: var(--sl-radius-3);
    background: var(--sl-bg-base-soft);
  }
  .drawer-row > [data-sl-field]:first-child { flex: 1 1 auto; min-width: 0; }
  /* A quantidade cabe em três dígitos com folga; o que sobra vai para o produto,
     onde o nome do SKU precisa de espaço. */
  .drawer-row > [data-sl-field]:nth-child(2) { flex: 0 0 88px; min-width: 0; }
  /* O remover alinha pela caixa do campo, não pelo rótulo acima dela. */
  .drawer-row-remove { flex: 0 0 36px; padding-top: var(--sl-space-7); }
  .drawer-add { padding-top: var(--sl-space-4); }
  /* Mesma pintura do :disabled do botão primário do Shoreline, aplicada pelo
     aria para o botão continuar recebendo o clique que revela as validações. */
  [data-sl-button][data-variant="primary"][aria-disabled="true"] {
    background: var(--sl-bg-base-strong-disabled);
    cursor: not-allowed;
  }

  .modal-root [data-sl-modal-backdrop] { position: fixed; inset: 0; }
</style>
</head>

  <div class="body">

    <main class="content">
      <div data-sl-page id="screen-listing">

        <!-- PageHeader do Shoreline = Container > Content (narrow) > header >
             [data-sl-page-header]. É o Content que dá o padding, por container
             query: 40px na horizontal e 32px na vertical a partir de 800px. -->
        <div data-sl-container>
          <header data-sl-content data-narrow="true" data-sl-page-header-container>
            <div data-sl-page-header>
              <div data-sl-page-header-row>
                <h1 data-sl-heading data-variant="display1" data-sl-page-heading>Inventário futuro</h1>
                <div data-sl-stack data-horizontal="true" style="--sl-stack-space: var(--sl-space-4)">

                  <div data-sl-bleed>
                    <div data-sl-bleed-content style="--sl-bleed-top: var(--sl-space-2); --sl-bleed-bottom: var(--sl-space-2)">

                        <span data-sl-button-content>
                          <i data-icon="plus"></i>
                          Criar lote futuro
                        </span>
                      </button>
                    </div>
                  </div>
                  <div data-sl-bleed>
                    <div data-sl-bleed-content style="--sl-bleed-top: var(--sl-space-2); --sl-bleed-bottom: var(--sl-space-2)">
                      <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="large" aria-label="Mais ações">
                        <span data-sl-button-content>

        </div>

        <div data-sl-page-container>
          <div data-sl-page-content data-layout="wide">

            <div data-sl-collection>

            <div data-sl-collection-row>
              <div data-sl-search class="list-search">
                <span data-sl-pre-icon>
                  <i data-icon="magnifying-glass-small"></i>
                </span>
                <input data-sl-search-input id="search" placeholder="Buscar nome do lote, Lote ID ou SKU" autocomplete="off">
              </div>

              <div class="toolbar-end">
                <button data-sl-button data-variant="secondary" data-size="normal" id="btn-export" type="button">
                  <span data-sl-button-content>
                    <i data-icon="download-simple"></i>
                    Exportar
                  </span>
                </button>

                <!-- A visão selecionada é anunciada por aria-pressed, não só
                     pela variante do botão: cor sozinha não é acessível. -->
                <div class="segmented" id="view-toggle">
                  <button data-sl-button data-variant="secondary" data-size="normal" data-view="lots" aria-pressed="true">
                    <span data-sl-button-content>
                      <i data-icon="rows"></i>
                      Por lote
                    </span>                  </button>
                  <button data-sl-button data-variant="tertiary" data-size="normal" data-view="skus" aria-pressed="false">
                    <span data-sl-button-content>
                      <i data-icon="tag"></i>
                      Por SKU
                    </span>                  </button>
                </div>

                <!-- O Pagination não tem layout próprio: quem põe rótulo e setas
                     lado a lado é o Stack horizontal que ele renderiza dentro. -->
                <div data-sl-pagination>
                  <div data-sl-stack data-horizontal="true" style="--sl-stack-space: var(--sl-space-2)">
                    <div data-sl-pagination-label data-loading="false" id="pag-label">—</div>
                    <div data-sl-pagination-actions>
                      <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal" data-sl-pagination-action-prev id="pag-prev" aria-label="Página anterior">
                        <span data-sl-button-content>

                        </span>
                      </button>
                      <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal" data-sl-pagination-action-next id="pag-next" aria-label="Próxima página">
                        <span data-sl-button-content>
                          <i data-icon="caret-right"></i>
                        </span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div data-sl-collection-row style="--justify: flex-start" id="filter-row">
              <!-- Cada filtro: gatilho + popover. Conteúdo montado pelo script. -->
              <div class="filter" data-filter="destinations" data-open="false">
                <button data-sl-filter-trigger data-sl-button data-variant="secondary" data-size="normal" aria-expanded="false">
                  <span data-sl-button-content>
                    <span>Destino</span><span data-sl-filter-value></span>
                    <i data-icon="caret-down-small"></i>
                  </span>                </button>
                <div class="filter-popover" data-sl-filter-popover data-sl-popover>
                  <!-- Conteúdo montado pelo script: o grid do contêiner distribui
                       as linhas pelos filhos diretos, então a lista e o rodapé
                       não podem ficar dentro de um invólucro. -->
                  <div data-sl-container></div>
                </div>
              </div>

              <div class="filter" data-filter="arrival" data-open="false">
                <button data-sl-filter-trigger data-sl-button data-variant="secondary" data-size="normal" aria-expanded="false">
                  <span data-sl-button-content>
                    <span>Data de chegada</span><span data-sl-filter-value></span>
                    <i data-icon="caret-down-small"></i>
                  </span>                </button>
                <div class="filter-popover" data-sl-filter-popover data-sl-popover>
                  <!-- Conteúdo montado pelo script: o grid do contêiner distribui
                       as linhas pelos filhos diretos, então a lista e o rodapé
                       não podem ficar dentro de um invólucro. -->
                  <div data-sl-container></div>
                </div>
              </div>

              <div class="filter" data-filter="quantity" data-open="false">
                <button data-sl-filter-trigger data-sl-button data-variant="secondary" data-size="normal" aria-expanded="false">
                  <span data-sl-button-content>
                    <span>Quantidade</span><span data-sl-filter-value></span>
                    <i data-icon="caret-down-small"></i>
                  </span>                </button>
                <div class="filter-popover" data-sl-filter-popover data-sl-popover>
                  <!-- Conteúdo montado pelo script: o grid do contêiner distribui
                       as linhas pelos filhos diretos, então a lista e o rodapé
                       não podem ficar dentro de um invólucro. -->
                  <div data-sl-container></div>
                </div>
              </div>

              <div class="filter" data-filter="statuses" data-open="false">
                <button data-sl-filter-trigger data-sl-button data-variant="secondary" data-size="normal" aria-expanded="false">
                  <span data-sl-button-content>
                    <span>Status</span><span data-sl-filter-value></span>
                    <i data-icon="caret-down-small"></i>
                  </span>                </button>
                <div class="filter-popover" data-sl-filter-popover data-sl-popover>
                  <!-- Conteúdo montado pelo script: o grid do contêiner distribui
                       as linhas pelos filhos diretos, então a lista e o rodapé
                       não podem ficar dentro de um invólucro. -->
                  <div data-sl-container></div>
                </div>
              </div>
            </div>

            <!-- header-sticky troca o overflow interno da tabela por rolagem da
                 página e fixa o cabeçalho: é o mecanismo do próprio componente.

                 Cabeçalho e grade são montados pelo script a partir de COLUMNS,
                 porque as duas visões têm um número diferente de colunas — e
                 porque é a mesma definição que o esqueleto de carregamento lê. -->
            <div data-sl-table id="table" data-sl-table-header-sticky="true" data-sl-table-density="default">
              <div data-sl-table-header id="thead"></div>
              <div data-sl-table-body id="tbody"></div>
            </div>

            <div id="state-slot"></div>

            <!-- A paginação de baixo é uma linha alinhada à direita, sem rodapé

            <div data-sl-collection-row style="--justify: flex-end" id="table-footer">
              <div data-sl-pagination>
                <div data-sl-stack data-horizontal="true" style="--sl-stack-space: var(--sl-space-2)">

                  <div data-sl-pagination-actions>
                    <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal" data-sl-pagination-action-prev id="pag-prev-2" aria-label="Página anterior">

                      </span>
                    </button>
                    <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal" data-sl-pagination-action-next id="pag-next-2" aria-label="Próxima página">
                      <span data-sl-button-content>
                        <i data-icon="caret-right"></i>
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            </div><!-- /data-sl-collection -->

          </div>
        </div>
      </div>

      <!-- Tela de criação. Mesma casca de Page da listagem: o que muda é o
           cabeçalho (voltar + duas ações) e o conteúdo, que é um formulário de
           largura fixa. A navegação lateral some enquanto ela está aberta. -->
      <div data-sl-page id="screen-create" hidden>

        <div data-sl-container>
          <header data-sl-content data-narrow="true" data-sl-page-header-container>
            <div data-sl-page-header>
              <div data-sl-page-header-row>
                <div class="page-title-back">
                  <!-- O Bleed puxa o botão para a margem: o alvo de 40px do

                  <div data-sl-bleed>
                    <div data-sl-bleed-content style="--sl-bleed-start: var(--sl-space-3); --sl-bleed-top: var(--sl-space-2); --sl-bleed-bottom: var(--sl-space-2)">
                      <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="large"

                        <span data-sl-button-content>

                <div data-sl-stack data-horizontal="true" style="--sl-stack-space: var(--sl-space-4)">

                  </div>
                  <div data-sl-bleed>
                    <div data-sl-bleed-content style="--sl-bleed-top: var(--sl-space-2); --sl-bleed-bottom: var(--sl-space-2)">
                      <button data-sl-button data-variant="primary" data-size="large" id="btn-save">
                        <span data-sl-button-content>Salvar</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </header>
        </div>

        <div data-sl-page-container>
          <div data-sl-page-content data-layout="wide">
            <!-- As três seções são montadas pelo script: é o mesmo estado que
                 alimenta a tabela de produtos e a validação. -->
            <form class="lot-form" id="lot-form" novalidate autocomplete="off"></form>
          </div>

<!-- Drawer de adicionar produtos. Fica fora da shell porque é montada na raiz
     do documento, e não tem fundo escurecido: o DrawerProvider do Shoreline
     passa modal: false ao Vaul de propósito — a drawer trata de um trabalho
     menor e não bloqueia a página. O painel acumula os três atributos porque
     o DrawerPopover monta Vaul.Content asChild sobre um Container. -->
<div class="drawer-root" id="drawer" data-enter="false" hidden>
  <div data-sl-container data-sl-drawer-popover data-size="medium" data-vaul-drawer-direction="right"

  ].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'))

  const FIGMA_DESTINATIONS = [
    { seller: 'Filial São Lucas',        warehouse: 'Estoque principal' },
    { seller: 'Filial Centro Histórico', warehouse: 'Estoque principal' },
    { seller: 'Filial Jardim Primavera', warehouse: 'Estoque principal' },

  const BRANCHES = [

    'Brooklin', 'Butantã', 'Campo Belo', 'Casa Verde', 'Freguesia do Ó',
    'Ipiranga', 'Itaim Bibi', 'Jabaquara', 'Lapa', 'Liberdade', 'Moema',
    'Mooca', 'Morumbi', 'Penha', 'Perdizes', 'Pinheiros', 'Santana',
    'Santo Amaro', 'Saúde', 'Tatuapé', 'Tucuruvi', 'Vila Madalena',
    'Vila Mariana', 'Vila Olímpia', 'Vila Prudente',

  const HUBS = [

    'Fortaleza', 'Goiânia', 'Manaus', 'Porto Alegre', 'Ribeirão Preto',
    'Rio de Janeiro', 'Salvador',
  ]

  const destKey = (d) => `${d.seller} — ${d.warehouse}`

  const byKey = (a, b) => destKey(a).localeCompare(destKey(b), 'pt-BR')

  /* O filtro lista os estoques da conta, não só os que têm lote a caminho — por
     isso o catálogo é uma fonte à parte, e não mais a projeção dos lotes. São 48
     destinos: passa de cinco, que é quando o Shoreline manda pôr busca, e é
     grande o bastante para o carregamento em partes fazer diferença. */
  const BASE_DESTINATIONS = [
    ...FIGMA_DESTINATIONS,
    ...BRANCHES.map((name) => ({ seller: `Filial ${name}`, warehouse: 'Estoque principal' })),
    ...HUBS.map((name) => ({ seller: `CD ${name}`, warehouse: 'Estoque produtos novos' })),
  ].sort(byKey)

  /* Oito sellers têm um segundo estoque. É o que dá o que escolher ao campo
     Estoque do formulário, que sozinho seria uma lista de um item só. Ficam
     fora dos destinos dos lotes de propósito: assim a listagem não muda por
     causa de um catálogo que só o formulário e o filtro precisam enxergar. */
  const EXTRA_WAREHOUSES = [
    ...FIGMA_DESTINATIONS.map((d) => ({ seller: d.seller, warehouse: 'Estoque mostruário' })),
    { seller: 'CD São Paulo',      warehouse: 'Estoque principal' },
    { seller: 'CD Recife',         warehouse: 'Estoque principal' },
    { seller: 'CD Rio de Janeiro', warehouse: 'Estoque principal' },
  ]

  const DESTINATIONS = [...BASE_DESTINATIONS, ...EXTRA_WAREHOUSES].sort(byKey)

  /* Ordem alfabética é uma das que as boas práticas do Filter aceitam, e é a que
     faz sentido numa lista longa em que nenhum destino é mais provável. */
  const DESTINATION_OPTIONS = DESTINATIONS.map(destKey)

  const SELLERS = [...new Set(DESTINATIONS.map((d) => d.seller))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR'))

  const warehousesOf = (seller) => DESTINATIONS
    .filter((d) => d.seller === seller)
    .map((d) => d.warehouse)

  /* Os lotes ocupam 20 dos 56. O resto existe e aparece no filtro, mas não tem
     lote a caminho — filtrar por ele leva ao estado vazio, que é o que acontece
     no Admin quando o estoque escolhido não tem nada previsto. */
  const LOT_DESTINATIONS = [
    ...FIGMA_DESTINATIONS,
    ...BASE_DESTINATIONS.filter((d) => !FIGMA_DESTINATIONS.includes(d)).slice(0, 15),
  ]

  /* As cinco primeiras linhas reproduzem o Figma, incluindo as quantidades:
     o total do lote é sempre a soma dos SKUs, nunca um número guardado.

     Um SKU aparece no máximo uma vez por lote: na visão por SKU o par
     (lote, SKU) é a própria linha, e repetir o produto renderizaria linhas
     idênticas. O #001 concentra 15 SKUs para testar um lote grande na expansão.
     Todos os lotes têm mais de um produto para deixar a expansão útil. */
  const FIGMA_LOTS = [
    { code: '#001', name: 'Reposição de agosto',     dest: 0, date: '2026-08-05', status: 'scheduled', items: [[0, 3], [1, 2], [2, 10], [3, 6], [4, 8], [5, 4], [6, 7], [7, 5], [8, 9], [9, 12], [10, 11], [11, 6], [12, 3], [13, 2], [14, 5]] },
    { code: '#002', name: 'Reposição natal',         dest: 1, date: '2026-08-12', status: 'received',  items: [[1, 4], [2, 6]] },
    { code: '#003', name: 'Reposição BF',            dest: 2, date: '2026-08-19', status: 'scheduled', items: [[3, 20], [4, 3]] },
    { code: '#004', name: 'Reposição setembro',      dest: 3, date: '2026-08-26', status: 'cancelled', items: [[5, 19], [0, 8]] },
    { code: '#005', name: 'Coleção primavera verão', dest: 4, date: '2026-08-31', status: 'inactive',  items: [[0, 24], [1, 18], [2, 12]] },
  ]

  const EXTRA_NAMES = [
    'Reposição semanal', 'Coleção cápsula', 'Reposição outlet', 'Lote promocional',
    'Reposição fim de mês', 'Coleção inverno', 'Reposição express', 'Lote de fornecedor',
    'Reposição marketplace', 'Coleção verão',
  ]

  /* Fixture determinística: o arquivo renderiza igual em qualquer abertura. */
  function buildLots() {
    const lots = FIGMA_LOTS.map((raw, index) => ({
      id: `lot-${index + 1}`,
      code: raw.code,
      name: raw.name,
      destination: FIGMA_DESTINATIONS[raw.dest],
      arrivalDate: raw.date,
      status: raw.status,
      items: raw.items.map(([productIndex, quantity], itemIndex) => ({
        id: `lot-${index + 1}-item-${itemIndex + 1}`,
        ...PRODUCTS[productIndex],
        quantity,
      })),
    }))

    for (let i = 5; i < 74; i += 1) {
      const code = `#${String(i + 1).padStart(3, '0')}`
      const name = `${EXTRA_NAMES[i % EXTRA_NAMES.length]} ${Math.floor(i / EXTRA_NAMES.length) + 1}`
      const day = ((i * 3) % 27) + 1
      const month = 8 + (i % 4)
      const itemCount = (i % 3) + 2
      const items = []

      for (let k = 0; k < itemCount; k += 1) {
        const product = PRODUCTS[(i + k) % PRODUCTS.length]
        items.push({
          id: `lot-${i + 1}-item-${k + 1}`,
          ...product,
          quantity: ((i + k * 7) % 40) + 2,
        })
      }

      lots.push({
        id: `lot-${i + 1}`,
        code,
        name,
        destination: LOT_DESTINATIONS[i % LOT_DESTINATIONS.length],
        arrivalDate: `2026-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`,
        /* O deslocamento por volta é o que impede status e destino de andarem
           juntos: com 20 destinos e 4 status, i % 4 seria constante dentro de um
           destino, e filtrar pelos dois ao mesmo tempo quase nunca acharia nada. */
        status: STATUSES[(i + Math.floor(i / LOT_DESTINATIONS.length)) % STATUSES.length].id,
        items,
      })
    }

    return lots
  }

  const LOTS = buildLots()

  /* A visão por SKU é a mesma fixture achatada: cada lote contribui uma linha
     por item, e a linha guarda uma projeção do lote em vez de repetir a busca
     depois. Destino, chegada e status são propriedade do lote — a linha lê, não
     declara. O achatamento acontece uma vez, na carga. */
  const buildSkuRows = (lots) =>
    lots.flatMap((lot) =>
      lot.items.map((item, itemIndex) => ({
        id: `${lot.id}:${item.skuId}`,
        skuId: item.skuId,
        name: item.name,
        quantity: item.quantity,
        itemIndex,
        lot: {
          id: lot.id,
          code: lot.code,
          name: lot.name,
          destination: lot.destination,
          arrivalDate: lot.arrivalDate,
          status: lot.status,
        },
      })))

  /* Reatribuído a cada lote salvo no formulário: a visão por SKU precisa
     enxergar o que acabou de ser criado (INV-8). */
  let SKU_ROWS = buildSkuRows(LOTS)

  const state = {
    /* 'lots' ou 'skus'. A busca, os filtros e a paginação são os mesmos nas
       duas visões; só muda o que cada linha representa. */
    view: 'lots',
    search: '',
    filters: {
      destinations: [],
      arrival: { start: null, end: null },
      quantity: { min: null, max: null },
      statuses: [...DEFAULT_STATUSES],
    },
    /* Enquanto ninguém mexe no filtro de status, aquela marcação é o padrão da tela
       e não uma escolha de quem está usando — e é por isso que a busca pode passar
       por cima dela. Depois de mexer, é escolha, e escolha a busca respeita. */
    statusesTouched: false,
    page: 1,
    expanded: new Set(),
    /* Um recolhimento explícito vence a expansão automática da busca. */
    collapsedDuringSearch: new Set(),
    isLoading: true,
  }

  const norm = (value) =>
    String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()

  const lotQuantity = (lot) => lot.items.reduce((total, item) => total + item.quantity, 0)

  const formatDate = (iso) => {
    const [year, month, day] = iso.split('-')
    return `${day}/${month}/${year}`
  }

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  /* Buscar um lote recebido não pode dar em nada: quem digita um código quer aquele
     lote. Então, enquanto a marcação de status ainda é a padrão, a busca a suspende
     — no gatilho, dentro do popover e na consulta, para os três dizerem o mesmo. */
  const statusScopeActive = () => state.statusesTouched || !state.search.trim()

  const effectiveStatuses = () => statusScopeActive() ? state.filters.statuses : []

  const effectiveFilters = () => statusScopeActive()
    ? state.filters
    : { ...state.filters, statuses: [] }

  const hasActiveQuery = () => {
    const f = state.filters
    return Boolean(
      state.search.trim() ||
      f.destinations.length ||
      (state.statusesTouched && f.statuses.length) ||
      f.arrival.start || f.arrival.end ||
      f.quantity.min !== null || f.quantity.max !== null
    )
  }

  const isDateRangeValid = (start, end) => !start || !end || start <= end

  /* Os três filtros que perguntam ao lote — destino, chegada e status — valem
     igual nas duas visões, então moram numa função só: assim uma mudança de
     semântica não pode passar a valer em uma visão e não na outra. Só a
     quantidade fica de fora, porque é o único filtro cujo sujeito muda.
     Os filtros são uma conjunção, então a ordem entre eles não altera o
     resultado. */
  function matchesLotFilters(lot, filters) {
    if (filters.destinations.length && !filters.destinations.includes(destKey(lot.destination))) return false

    if (isDateRangeValid(filters.arrival.start, filters.arrival.end)) {
      if (filters.arrival.start && lot.arrivalDate < filters.arrival.start) return false
      if (filters.arrival.end && lot.arrivalDate > filters.arrival.end) return false
    }

    if (filters.statuses.length && !filters.statuses.includes(lot.status)) return false

    return true
  }

  /* Quem chega primeiro fica no topo — é o que a operação precisa saber antes de
     qualquer outra coisa. O código do lote desempata para a ordem ser total: dois
     lotes do mesmo dia trocariam de lugar entre renders, e com eles a paginação. */
  const byArrival = (a, b) =>
    a.arrivalDate.localeCompare(b.arrivalDate) || a.code.localeCompare(b.code)

  /* Pipeline na ordem documentada: busca → destino → data → quantidade → status. */
  function runQuery({ paginate = true } = {}) {
    const term = norm(state.search.trim())
    const f = effectiveFilters()
    const skuMatched = []

    let result = LOTS.filter((lot) => {
      if (term) {
        const direct = norm(lot.code).includes(term) || norm(lot.name).includes(term)
        const viaSku = lot.items.some(
          (item) => norm(item.name).includes(term) || norm(item.skuId).includes(term)
        )
        if (!direct && !viaSku) return false
        if (!direct && viaSku) skuMatched.push(lot.id)
      }

      if (!matchesLotFilters(lot, f)) return false

      const quantity = lotQuantity(lot)
      if (f.quantity.min !== null && quantity < f.quantity.min) return false
      if (f.quantity.max !== null && quantity > f.quantity.max) return false

      return true
    }).sort(byArrival)

    const total = result.length
    const start = (state.page - 1) * PAGE_SIZE

    return { lots: paginate ? result.slice(start, start + PAGE_SIZE) : result, total, skuMatched }
  }

  /* Mesma pipeline sobre as linhas achatadas, com duas diferenças: a quantidade
     limitada é a do SKU na linha — sempre o número que está na coluna visível —
     e não existe expansão automática, porque aqui o SKU que casou já é a linha.

     A ordem é a mesma da visão por lote, com a posição do SKU dentro do lote como
     último desempate: linhas do mesmo lote ficam juntas e na ordem em que foram
     escritas. */
  function runSkuQuery({ paginate = true } = {}) {
    const term = norm(state.search.trim())
    const f = effectiveFilters()

    const result = SKU_ROWS.filter((row) => {
      if (term) {
        const matched = norm(row.name).includes(term) ||
          norm(row.skuId).includes(term) ||
          norm(row.lot.code).includes(term) ||
          norm(row.lot.name).includes(term)
        if (!matched) return false
      }

      if (!matchesLotFilters(row.lot, f)) return false

      if (f.quantity.min !== null && row.quantity < f.quantity.min) return false
      if (f.quantity.max !== null && row.quantity > f.quantity.max) return false

      return true
    }).sort((a, b) => byArrival(a.lot, b.lot) || a.itemIndex - b.itemIndex)

    const total = result.length
    const start = (state.page - 1) * PAGE_SIZE

    return { rows: paginate ? result.slice(start, start + PAGE_SIZE) : result, total }
  }

  /* Em produção a miniatura é a foto do SKU vinda do catálogo. Aqui o desenho
     sai do nome do produto: é artifício de fixture, não regra de negócio.

     Acessório é o primeiro teste porque o nome de um acessório costuma citar o
     aparelho a que serve: sem isso, "Capa Transparente para Celular" viraria um
     celular e "Mochila para Notebook" um notebook. */
  const productKind = (name) => {
    const value = norm(name)

    if (/(capa|mochila|cabo|carregador|carregamento|adaptador|dock|tomada|cartao|kit teclado|fita de led|porta-retrato|ssd)/.test(value)) return 'accessory'
    if (/(iphone|galaxy|smartphone|celular)/.test(value)) return 'phone'
    if (/(smart tv|oled|uhd)/.test(value)) return 'tv'
    if (/(fone|headphone)/.test(value)) return 'audio'
    if (/notebook/.test(value)) return 'laptop'
    if (/(caixa de som|soundbar)/.test(value)) return 'speaker'
    if (/maquina de lavar/.test(value)) return 'appliance'
    if (/(tablet|leitor digital)/.test(value)) return 'tablet'
    if (/monitor/.test(value)) return 'monitor'
    if (/(camera|webcam|drone|campainha)/.test(value)) return 'camera'
    if (/(smartwatch|relogio)/.test(value)) return 'watch'
    if (/projetor/.test(value)) return 'projector'
    if (/(roteador|mesh|hub)/.test(value)) return 'network'

    return 'device'
  }

  const thumbSvg = (kind) => {
    const stroke = 'currentColor'
    const soft = 'var(--sl-color-gray-2)'

    const svg = {
      phone: `<rect x="14" y="7" width="12" height="26" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><line x1="18" y1="29" x2="22" y2="29" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/>`,
      tv: `<rect x="7" y="10" width="26" height="17" rx="2.5" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><line x1="16" y1="31" x2="24" y2="31" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="27" x2="20" y2="31" stroke="${dark}" stroke-width="1.5"/>`,
      audio: `<path d="M12 22v-4a8 8 0 0 1 16 0v4" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round"/><rect x="9" y="20" width="6" height="10" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><rect x="25" y="20" width="6" height="10" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/>`,
      laptop: `<rect x="10" y="9" width="20" height="17" rx="2" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M7 30h26l-3-4H10l-3 4Z" fill="${base}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>`,
      speaker: `<rect x="11" y="7" width="18" height="26" rx="4" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><circle cx="20" cy="23" r="5" fill="${base}" stroke="${stroke}" stroke-width="1.5"/><circle cx="20" cy="14" r="2" fill="${dark}"/>`,
      appliance: `<rect x="10" y="6" width="20" height="28" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M14 11h12" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/><circle cx="20" cy="23" r="7" fill="${base}" stroke="${stroke}" stroke-width="1.5"/><circle cx="20" cy="23" r="3" fill="none" stroke="${dark}" stroke-width="1.5"/>`,
      tablet: `<rect x="9" y="7" width="22" height="26" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><line x1="18" y1="29" x2="22" y2="29" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/>`,
      monitor: `<rect x="7" y="9" width="26" height="18" rx="2.5" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M17 31h6M20 27v4" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/>`,
      camera: `<rect x="8" y="13" width="24" height="16" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><circle cx="20" cy="21" r="5" fill="${base}" stroke="${stroke}" stroke-width="1.5"/><path d="M14 13l2-3h8l2 3" fill="${soft}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>`,
      accessory: `<path d="M14 8h12v13a6 6 0 0 1-12 0V8Z" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M17 8V5M23 8V5M18 17h4M20 15v4" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/>`,
      watch: `<rect x="14" y="12" width="12" height="16" rx="4" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M16 12l1-5h6l1 5M16 28l1 5h6l1-5" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>`,
      projector: `<rect x="8" y="15" width="20" height="13" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><circle cx="15" cy="21.5" r="4" fill="${base}" stroke="${stroke}" stroke-width="1.5"/><path d="M28 18l5-3v13l-5-3" fill="${base}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>`,
      network: `<circle cx="20" cy="21" r="4" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M11 15a13 13 0 0 1 18 0M15 18a7 7 0 0 1 10 0M20 25v5" fill="none" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/>`,
      device: `<rect x="9" y="10" width="22" height="20" rx="3" fill="${soft}" stroke="${stroke}" stroke-width="1.5"/><path d="M15 17h10M15 22h6" stroke="${dark}" stroke-width="1.5" stroke-linecap="round"/>`,
    }[kind]

    return `<svg width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true" focusable="false">${svg}</svg>`
  }

  const productThumb = (product, size = 'product') => (
    `<span class="${size === 'sku' ? 'sku-thumb' : 'product-thumb'}" aria-label="${escapeHtml(product.name)}">${thumbSvg(productKind(product.name))}</span>`
  )

  const DOTS = icon('dots-three-vertical')

  /* A coluna de expandir do Shoreline troca o ícone em vez de girar um só, e usa
     os carets Normal de 20px (getExpandedColumn no pacote ts-table). */
  const CARET_RIGHT = icon('caret-right')
  const CARET_DOWN = icon('caret-down')

  function lotRowHtml(lot, isExpanded) {
    const status = statusById(lot.status)

    return `
      <div data-sl-table-row data-dim-on-hover="true" data-selected="false" data-expanded="${isExpanded}">
        <div data-sl-table-cell>
          <div class="lot-cell">
            <div data-sl-bleed>
              <div data-sl-bleed-content style="--sl-bleed-top: var(--sl-space-2); --sl-bleed-bottom: var(--sl-space-2); --sl-bleed-start: var(--sl-space-2); --sl-bleed-end: var(--sl-space-2)">
                <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
                        data-toggle="${lot.id}" aria-expanded="${isExpanded}"
                        aria-label="${isExpanded ? 'Recolher' : 'Expandir'} lote ${escapeHtml(lot.code)}">
                  <span data-sl-button-content>${isExpanded ? CARET_DOWN : CARET_RIGHT}</span>
                </button>
              </div>
            </div>
            <div class="cell-stack">
              <span class="lot-name">${escapeHtml(lot.name)}</span>
              <span class="cell-soft">Lote ID ${escapeHtml(lot.code)}</span>
            </div>
          </div>
        </div>
        <div data-sl-table-cell>
          <div class="cell-stack">
            <span>${escapeHtml(lot.destination.seller)}</span>
            <span class="cell-soft">${escapeHtml(lot.destination.warehouse)}</span>
          </div>
        </div>
        <div data-sl-table-cell class="num">${lotQuantity(lot)}</div>
        <div data-sl-table-cell>${formatDate(lot.arrivalDate)}</div>
        <div data-sl-table-cell>
          <span data-sl-tag data-color="${status.color}" data-size="normal" data-variant="secondary">${status.label}</span>
        </div>
        <div data-sl-table-cell>
          <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal" aria-label="Ações do lote ${escapeHtml(lot.code)}">
            <span data-sl-button-content>${DOTS}</span>
          </button>
        </div>
      </div>`
  }

  /* Um SKU herda destino, chegada e status do lote — por isso o travessão. */
  function itemRowHtml(item, isLast) {
    return `
      <div data-sl-table-row class="row-child${isLast ? ' row-child-last' : ''}" data-selected="false">
        <div data-sl-table-cell>
          <div class="sku-cell">
            ${productThumb(item, 'sku')}
            <div class="cell-stack">
              <span class="lot-name">${escapeHtml(item.name)}</span>
              <span class="cell-soft">SKU ID ${escapeHtml(item.skuId)}</span>
            </div>
          </div>
        </div>
        <div data-sl-table-cell class="muted">—</div>
        <div data-sl-table-cell class="num">${item.quantity}</div>
        <div data-sl-table-cell class="muted">—</div>
        <div data-sl-table-cell class="muted">—</div>
        <div data-sl-table-cell></div>
      </div>`
  }

  /* Uma linha é o par (lote, SKU). Destino, chegada e status vêm do lote e
     aparecem por extenso: aqui eles são a resposta que o lojista procura, não
     um placeholder como no travessão da linha filha da visão por lote. */
  function skuRowHtml(row) {
    const status = statusById(row.lot.status)

    return `
      <div data-sl-table-row data-dim-on-hover="true" data-selected="false">
        <div data-sl-table-cell>
          <div class="product-cell">
            ${productThumb(row)}
            <div class="cell-stack">
              <span class="lot-name" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</span>
              <span class="cell-soft">SKU ID ${escapeHtml(row.skuId)}</span>
            </div>
          </div>
        </div>
        <div data-sl-table-cell>
          <div class="cell-stack">
            <span class="lot-name">${escapeHtml(row.lot.name)}</span>
            <span class="cell-soft">Lote ID ${escapeHtml(row.lot.code)}</span>
          </div>
        </div>
        <div data-sl-table-cell>
          <div class="cell-stack">
            <span>${escapeHtml(row.lot.destination.seller)}</span>
            <span class="cell-soft">${escapeHtml(row.lot.destination.warehouse)}</span>
          </div>
        </div>
        <div data-sl-table-cell class="num">${row.quantity}</div>
        <div data-sl-table-cell>${formatDate(row.lot.arrivalDate)}</div>
        <div data-sl-table-cell>
          <span data-sl-tag data-color="${status.color}" data-size="normal" data-variant="secondary">${status.label}</span>
        </div>
        <div data-sl-table-cell>
          <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal" aria-label="Ações do SKU ${escapeHtml(row.skuId)} no lote ${escapeHtml(row.lot.code)}">
            <span data-sl-button-content>${DOTS}</span>
          </button>
        </div>
      </div>`
  }

  const el = (id) => document.getElementById(id)

  /* ── Geometria da tabela ─────────────────────────────────── */

  /* Definição das colunas por visão: rótulo, largura na grade, classe da célula
     e as barras que o esqueleto desenha. Cabeçalho, grade e esqueleto leem
     daqui — é o que garante que nenhuma coluna mude de largura quando o dado
     substitui o esqueleto.

     Cada largura é o conteúdo mais largo da fixture mais os 16px de separação;
     Quantidade é medida pelo cabeçalho, que é bem mais largo que o número. São
     larguras fixas, e não max-content, porque com max-content quem media as
     colunas eram as barras do esqueleto — e aí elas pulavam ao sair.

     Cinco colunas da visão por SKU carregam o mesmo conteúdo da visão por lote
     e herdam as medidas de lá. As duas novas foram medidas no navegador: Lote
     vale o nome mais longo da fixture, 168px em "Reposição marketplace 4", mais
     os 16px; Produto fica com a coluna flexível e repete o piso de 230px que o
     Lote tem na outra visão — o bastante para a miniatura, a linha do SKU ID e
     um pedaço legível do nome, que trunca com reticências. */
  const DESTINO_HELP = 'Seller e estoque que receberão o lote'

  const COLUMNS = {
    lots: [
      { label: 'Lote',       width: 'minmax(230px, 1fr)', bars: ['70%'] },
      { label: 'Destino',    width: '166px',              bars: ['90%', '60%'] },
      { label: 'Quantidade', width: '94px',  cell: 'num', bars: ['60%'] },
      { label: 'Chegada',    width: '97px',               bars: ['80%'] },
      { label: 'Status',     width: '106px',              bars: ['72%'] },
      { label: '',           width: '56px',               bars: [] },
    ],
    skus: [
      { label: 'Produto',    width: 'minmax(230px, 1fr)', thumb: true, bars: ['90%', '60%'] },
      { label: 'Lote',       width: '184px',              bars: ['90%', '60%'] },
      { label: 'Destino',    width: '166px', help: DESTINO_HELP, bars: ['90%', '60%'] },
      { label: 'Quantidade', width: '94px',  cell: 'num', bars: ['60%'] },
      { label: 'Chegada',    width: '97px',               bars: ['80%'] },
      { label: 'Status',     width: '106px',              bars: ['72%'] },
      { label: '',           width: '56px',               bars: [] },
    ],
  }

  /* O ContextualHelp do Shoreline: IconButton com o "?" num círculo cinza, e um
     popover com Container > Content. O gatilho tem 24px e a linha de texto do
     cabeçalho tem 20px, então o Bleed de -2px devolve os 44px que a Table
     prescreve para o cabeçalho. */
  function contextualHelpHtml(label, message) {
    return `
      <div data-sl-stack data-horizontal="true" style="--sl-stack-space: var(--sl-space-1)">
        <span>${escapeHtml(label)}</span>
        <div data-sl-bleed>
          <div data-sl-bleed-content style="--sl-bleed-top: var(--sl-space-05); --sl-bleed-bottom: var(--sl-space-05)">
            <div data-sl-contextual-help class="header-help" data-open="false">
              <button data-sl-button data-sl-icon-button data-sl-contextual-help-trigger
                      data-variant="secondary" data-size="normal" type="button"
                      aria-expanded="false" aria-label="Sobre a coluna ${escapeHtml(label)}">
                <span data-sl-button-content>
                  <span data-sl-contextual-help-trigger-bg>?</span>
                </span>
              </button>
              <div class="header-help-popover" data-sl-contextual-help-popover data-sl-popover>
                <div data-sl-container>
                  <div data-sl-content data-narrow="false">${escapeHtml(message)}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`
  }

  /* Só é chamado na carga e ao trocar de visão: a geometria depende de
     state.view e de mais nada, e refazer o cabeçalho a cada busca fecharia a
     ajuda contextual no meio da digitação. */
  function renderTableHead() {
    const columns = COLUMNS[state.view]

    el('table').style.setProperty(
      '--sl-table-grid-template-columns',
      columns.map((column) => column.width).join(' '))

    el('thead').innerHTML = `
      <div data-sl-table-row>${columns.map((column) => `
        <div data-sl-table-header-cell${column.cell ? ` class="${column.cell}"` : ''}>${
          column.help ? contextualHelpHtml(column.label, column.help) : escapeHtml(column.label)
        }</div>`).join('')}
      </div>`
  }

  /* Rótulo e setas mudam sempre juntos, inclusive nos estados sem lista: com o
     resultado vazio a paginação precisa dizer "0 de 0", não o total anterior.
     Carregando, o Shoreline troca o rótulo por um Skeleton e desabilita as duas
     setas — é o que data-loading="true" dimensiona no CSS. */
  function updatePagination({ total, isLoading = false }) {
    const labels = ['pag-label', 'pag-label-2'].map(el)
    const buttons = ['pag-prev', 'pag-prev-2', 'pag-next', 'pag-next-2'].map(el)

    if (isLoading) {
      for (const label of labels) {
        label.dataset.loading = 'true'
        label.innerHTML = '<div data-sl-skeleton></div>'
      }
      for (const button of buttons) button.disabled = true
      return
    }

    const first = (state.page - 1) * PAGE_SIZE + 1
    const last = Math.min(state.page * PAGE_SIZE, total)
    const lastPage = Math.ceil(total / PAGE_SIZE)

    /* Numa única página o Shoreline omite o intervalo: "6 de 6", não "1 — 6 de 6". */
    const text = total <= PAGE_SIZE
      ? `${last} de ${total}`
      : `${first} — ${last} de ${total}`

    for (const label of labels) {
      label.dataset.loading = 'false'
      label.textContent = text
    }
    for (const id of ['pag-prev', 'pag-prev-2']) el(id).disabled = state.page === 1
    for (const id of ['pag-next', 'pag-next-2']) el(id).disabled = state.page >= lastPage
  }

  function syncExportButton(total = 0, isLoading = false) {
    const button = el('btn-export')
    button.disabled = isLoading || total === 0
    button.setAttribute('aria-label', `Exportar ${state.view === 'skus' ? 'SKUs' : 'lotes'} filtrados`)
  }

  /* O carregamento acontece dentro da tabela, com cabeçalho visível e uma
     skeleton por célula. Assim a linha de carregamento tem a mesma geometria da
     linha com dado — inclusive os 64px — e nada salta quando o dado chega. */
  function renderSkeleton() {
    const bar = (width, height = 20) =>
      `<div data-sl-skeleton data-sl-skeleton-shape="rect" style="--sl-skeleton-width: ${width}; --sl-skeleton-height: ${height}px"></div>`

    /* flex: 1 porque a pilha só tem barras de largura percentual: sem conteúdo
       de texto ela não tem largura intrínseca, e a porcentagem resolveria em
       zero. Com base 0 ela também cede a miniatura de 40px na coluna Produto. */
    const cell = (column) => {
      const stack = column.bars.length > 1
        ? `<div class="cell-stack" style="flex: 1">${column.bars.map((width, i) => bar(width, i ? 16 : 20)).join('')}</div>`
        : column.bars.map((width) => bar(width)).join('')

      const content = column.thumb
        ? `<div class="product-cell" style="flex: 1">${bar('40px', 40)}${stack}</div>`
        : stack

      return `<div data-sl-table-cell${column.cell ? ` class="${column.cell}"` : ''}>${content}</div>`
    }

    el('table').style.display = ''
    el('table-footer').style.display = 'none'
    el('state-slot').innerHTML = ''
    updatePagination({ total: 0, isLoading: true })
    syncExportButton(0, true)

    const cells = COLUMNS[state.view].map(cell).join('')

    el('tbody').innerHTML = Array.from({ length: 6 }, () => `
      <div data-sl-table-row data-dim-on-hover="false">${cells}</div>`).join('')
  }

  /* O CollectionView do Shoreline: fora do estado "ready" ele troca a lista por
     um EmptyState size="large" — ilustração, título, descrição e ação — dentro
     de um data-sl-collection-view, que é quem centraliza o bloco e reserva os
     380px de altura mínima. As descrições começam por verbo e não terminam em
     ponto, como o guia do componente pede.

     O título de "sem resultado" carrega o substantivo da visão; o de "sem dado
     nenhum" fala em lote nas duas, porque ali o substantivo segue a ação
     oferecida, que é criar um lote. */
  function renderEmpty() {
    el('table').style.display = 'none'
    el('table-footer').style.display = 'none'
    updatePagination({ total: 0 })
    syncExportButton(0)

    const filtered = hasActiveQuery()
    const noun = state.view === 'skus' ? 'SKU' : 'lote'

    const heading = filtered ? `Nenhum ${noun} encontrado` : 'Nenhum lote futuro ainda'
    const description = filtered
      ? 'Tente outros termos ou filtros'
      : 'Crie um lote para programar as chegadas'
    const action = filtered
      ? `<button data-sl-button data-sl-collection-view-action data-variant="secondary" data-size="normal" type="button" id="btn-clear-all">
           <span data-sl-button-content>Limpar filtros</span>
         </button>`
      : `<button data-sl-button data-sl-collection-view-action data-variant="primary" data-size="normal" type="button" id="btn-create-empty">
           <span data-sl-button-content>${icon('plus')}Criar lote futuro</span>
         </button>`

    el('state-slot').innerHTML = `
      <div data-sl-collection-view>
        <div data-sl-empty-state data-sl-size="large">
          <div data-sl-empty-state-container>
            <div data-sl-empty-state-illustration data-sl-collection-view-illustration
                 style="color: var(--sl-color-gray-8)">${icon(filtered ? 'magnifying-glass' : 'plus-circle')}</div>
            <h3 data-sl-heading data-variant="context" data-sl-collection-view-heading>${heading}</h3>
            <span data-sl-text data-variant="context" data-sl-collection-view-description>${description}</span>
            <div data-sl-empty-state-actions>${action}</div>
          </div>
        </div>
      </div>`

    const clear = el('btn-clear-all')
    if (clear) clear.addEventListener('click', clearEverything)

    const create = el('btn-create-empty')
    if (create) create.addEventListener('click', () => goTo(ROUTES.create))
  }

  /* Monta o corpo da visão por lote, com a expansão e a abertura automática da
     busca — nada disso existe na visão por SKU, onde o SKU que casou já é a
     própria linha. */
  function lotBodyHtml(lots, skuMatched) {
    const searching = Boolean(state.search.trim())

    return lots.map((lot) => {
      const autoExpanded = searching &&
        skuMatched.includes(lot.id) &&
        !state.collapsedDuringSearch.has(lot.id)
      const isExpanded = state.expanded.has(lot.id) || autoExpanded

      return lotRowHtml(lot, isExpanded) +
        (isExpanded
          ? lot.items.map((item, i) => itemRowHtml(item, i === lot.items.length - 1)).join('')
          : '')
    }).join('')
  }

  function render() {
    if (state.isLoading) {
      renderSkeleton()
      return
    }

    const isSkuView = state.view === 'skus'
    const result = isSkuView ? runSkuQuery() : runQuery()

    if (!result.total) {
      renderEmpty()
      syncFilterTriggers()
      return
    }

    el('state-slot').innerHTML = ''
    el('table').style.display = ''
    el('table-footer').style.display = ''

    el('tbody').innerHTML = isSkuView
      ? result.rows.map(skuRowHtml).join('')
      : lotBodyHtml(result.lots, result.skuMatched)

    updatePagination({ total: result.total })
    syncExportButton(result.total)
    syncFilterTriggers()
  }

  const csvCell = (value) => {
    const text = String(value ?? '')
    return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text
  }

  const csvLine = (values) => values.map(csvCell).join(',')

  function exportRows() {
    const isSkuView = state.view === 'skus'
    const result = isSkuView ? runSkuQuery({ paginate: false }) : runQuery({ paginate: false })
    const rows = isSkuView ? result.rows : result.lots

    if (!rows.length) return

    const headers = isSkuView
      ? ['SKU ID', 'Produto', 'Lote ID', 'Nome do lote', 'Seller', 'Estoque', 'Quantidade', 'Chegada', 'Status']
      : ['Lote ID', 'Nome do lote', 'Seller', 'Estoque', 'Quantidade', 'Chegada', 'Status']

    const body = rows.map((row) => {
      if (isSkuView) {
        const status = statusById(row.lot.status).label
        return [
          row.skuId,
          row.name,
          row.lot.code,
          row.lot.name,
          row.lot.destination.seller,
          row.lot.destination.warehouse,
          row.quantity,
          formatDate(row.lot.arrivalDate),
          status,
        ]
      }

      const status = statusById(row.status).label
      return [
        row.code,
        row.name,
        row.destination.seller,
        row.destination.warehouse,
        lotQuantity(row),
        formatDate(row.arrivalDate),
        status,
      ]
    })

    const csv = [headers, ...body].map(csvLine).join('\n')
    const blob = new Blob([`\ufeff${csv}`], { type: 'text/csv;charset=utf-8' })
    const url = URL.createObjectURL(blob)
    const link = document.createElement('a')
    const suffix = new Date().toISOString().slice(0, 10)

    link.href = url
    link.download = `inventario-futuro-${isSkuView ? 'por-sku' : 'por-lote'}-${suffix}.csv`
    document.body.appendChild(link)
    link.click()
    link.remove()
    URL.revokeObjectURL(url)

    showToast(`${rows.length} ${isSkuView ? 'SKUs' : 'lotes'} exportados`)
  }

  /* Trocar de visão é a mesma pergunta noutra granularidade: busca e filtros
     sobrevivem intocados. A página volta para a primeira porque os totais das
     duas visões são diferentes — a página 5 da visão por SKU não existe na
     visão por lote. */
  function setView(view) {
    if (state.view === view) return

    state.view = view

    for (const button of document.querySelectorAll('#view-toggle [data-view]')) {
      const isCurrent = button.dataset.view === view
      button.dataset.variant = isCurrent ? 'secondary' : 'tertiary'
      button.setAttribute('aria-pressed', String(isCurrent))
    }

    resetToFirstPage()
    renderTableHead()
    render()
  }

  /* Qualquer mudança de busca ou filtro volta para a primeira página. */
  function resetToFirstPage() {
    state.page = 1
    state.expanded.clear()
  }

  /* "Limpar filtros" devolve a listagem como ela abre — e ela abre sem os lotes que
     já foram recebidos ou cancelados. */
  function clearEverything() {
    state.search = ''
    el('search').value = ''
    state.filters = {
      destinations: [],
      arrival: { start: null, end: null },
      quantity: { min: null, max: null },
      statuses: [...DEFAULT_STATUSES],
    }
    state.statusesTouched = false
    state.collapsedDuringSearch.clear()
    resetToFirstPage()
    buildFilterBodies()
    render()
  }

  /* ── Filtros ─────────────────────────────────────────────── */

  const filterNode = (name) => document.querySelector(`.filter[data-filter="${name}"]`)

  /* Mesmo IconCheckSmall que o FilterItem do Shoreline usa no modo múltiplo. */
  const CHECK = icon('check-small')

  /* O indicador só existe quando a opção está marcada: é ele que pinta o
     quadrado de azul. A caixa vazia vem do próprio data-sl-filter-item-check. */
  function filterItemHtml(value, label, isSelected) {
    return `
      <span data-sl-filter-item role="option" aria-selected="${isSelected}" data-value="${escapeHtml(value)}">
        <span data-sl-filter-item-check data-multiselect="true" aria-hidden="true">
          ${isSelected ? `<span data-sl-filter-item-check-indicator data-multiselect="true">${CHECK}</span>` : ''}
        </span>
        <span>${escapeHtml(label)}</span>
      </span>`
  }

  function optionListHtml(options, selected) {
    return `<div data-sl-filter-list role="listbox" aria-multiselectable="true">${
      options.map((o) => filterItemHtml(o.value, o.label, selected.includes(o.value))).join('')
    }</div>`
  }

  /* ── Lista de destinos ───────────────────────────────────────
     Duas coisas acontecem aqui. A busca é padrão do Shoreline: as boas práticas
     do Filter mandam incluir uma Search quando a lista costuma passar de cinco
     itens, e a story assíncrona do componente mostra o desenho — Search no topo,
     FilterListSkeleton na espera, EmptyState pequeno quando não casa nada.

     O carregamento em partes não é: o Shoreline não tem paginação nem scroll
     infinito em filtro, a story dele corta o resultado em dez no servidor e
     encerra o assunto. As dez por vez daqui são extensão nossa, resolvendo o
     caso de uma conta com muitos estoques.
     ───────────────────────────────────────────────────────────── */

  const DESTINATION_PAGE = 10
