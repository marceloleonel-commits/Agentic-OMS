<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário futuro — Listagem (protótipo)</title>

<!--
  Protótipo da listagem do módulo Inventário futuro, nas duas granularidades:
  por lote e por SKU.

  Fidelidade visual vem do CSS real do Shoreline, carregado do unpkg com a
  versão pinada. A estilização do Shoreline é feita por seletores de atributo
  (data-sl-*), então funciona em HTML estático, sem React e sem build.

  A versão está pinada porque os atributos data-sl-* não são API pública
  documentada para escrita manual: uma atualização do Shoreline pode mudá-los.
-->
<link rel="stylesheet" href="https://unpkg.com/@vtex/shoreline@1.12.13/dist/themes/sunrise/styles.css">

<!--
  O token --sl-font-family-sans pede Inter, mas o Shoreline não empacota o
  webfont: no Admin real quem carrega a fonte é o shell. Sem isto o protótipo
  cai no fallback do sistema e muda de aparência em cada máquina — só quem tem
  Inter instalado localmente veria o resultado certo.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
  /* ─────────────────────────────────────────────────────────────
     Cromo do Admin (topbar e sidebar).
     Não existe componente Shoreline para isso, então é CSS próprio —
     mas todo valor vem de token --sl-*. Portado do shell mockado em React.
     ───────────────────────────────────────────────────────────── */

  /* O reset do Shoreline manda os controles herdarem a fonte
     (input, button { font: inherit }) e o base.css só define cor e fundo do
     body — a família de fonte fica por conta da aplicação. Sem declarar aqui,
     todo o cromo do Admin herda a serifada padrão do navegador. */
  body { margin: 0; font-family: var(--sl-font-family-sans); }

  .shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* No Figma a barra tem 60px: 36px de conteúdo mais 12px de padding em cima e
     embaixo. min-height em vez de height deixa a borda de baixo ficar fora dos
     60px, como no desenho, em vez de comer 1px do conteúdo. */
  .topbar {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    gap: var(--sl-space-4);
    min-height: 60px; padding: var(--sl-space-3);
    background: var(--sl-bg-base);
    border-bottom: var(--sl-border-base);
  }
  .topbar-start { display: flex; align-items: center; gap: var(--sl-space-2); flex: 1; min-width: 0; }
  .topbar-center { display: flex; justify-content: center; flex: 0 1 400px; min-width: 0; }
  .topbar-end { display: flex; align-items: center; justify-content: flex-end; gap: var(--sl-space-1); flex: 1; min-width: 0; }

  /* Os botões da barra são Button e IconButton tertiary de verdade: altura,
     padding, raio, texto em text-action e estados de hover vêm todos do
     Shoreline. A única regra que a topbar dispensa é o min-width de 100px do
     Button — no Figma "Help" tem 75px, ou seja, largura do conteúdo. */
  .topbar [data-sl-button] { min-width: auto; }

  .logo-account { display: flex; align-items: center; gap: var(--sl-space-1); height: 36px; }
  .logo {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px; border-radius: var(--sl-radius-2);
  }
  .account {
    display: flex; align-items: center; height: 36px;
    padding: 0 var(--sl-space-3); border-radius: var(--sl-radius-2);
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
    color: var(--sl-fg-base); white-space: nowrap;
  }

  /* 400x36 no Figma, fundo bg-muted (5% de cinza sobre o branco) e o texto de
     apoio em text-action, não em text-body. */
  .topbar-search {
    display: flex; align-items: center; justify-content: center; gap: var(--sl-space-2);
    width: 100%; max-width: 400px; height: 36px;
    padding: var(--sl-space-2) var(--sl-space-3);
    background: var(--sl-bg-muted); border-radius: var(--sl-radius-2);
    color: var(--sl-fg-muted); cursor: text;
    font: var(--sl-text-action-font); letter-spacing: var(--sl-text-action-letter-spacing);
    white-space: nowrap;
  }
  /* Sem width/height: cada ícone fica no tamanho para o qual foi desenhado —
     20px no Normal, 16px no Small. Como o traço é non-scaling-stroke, encolher
     um ícone de 20 para 16 mantém 1,5px de traço sobre um desenho menor, o que
     muda o peso aparente e tira os detalhes da grade de pixels. */
  .topbar-search svg { flex-shrink: 0; }

  /* A caixa de 36px alinha o avatar com os botões vizinhos; o círculo de 24px é
     o avatar em si. O Figma aponta direto para color-blue-3 e color-blue-10. */
  .avatar {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px;
  }
  .avatar-initial {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: var(--sl-radius-full);
    background: var(--sl-color-blue-3); color: var(--sl-color-blue-10);
    font: var(--sl-text-action-font); letter-spacing: var(--sl-text-action-letter-spacing);
  }

  .body { display: flex; flex: 1; min-height: 0; }

  /* 280px é a largura total, borda inclusa: box-sizing: border-box vem do reset
     do Shoreline. Os 20px de padding no topo colocam o primeiro item a 20px da
     borda do container, e os 20px na lateral é o que recua a pílula do item
     selecionado, deixando as linhas com 240px. */
  .sidebar {
    display: flex; flex-direction: column; flex-shrink: 0;
    width: 280px;
    padding: var(--sl-space-5) var(--sl-space-5) var(--sl-space-6);
    background: var(--sl-bg-base-soft);
    border-right: var(--sl-border-base);
    overflow-x: hidden; overflow-y: auto;
    transition: width 180ms ease, border-right-width 180ms ease, padding 180ms ease;
  }

  /* Em coluna flex, todo filho encolhe por padrão quando a lista não cabe. Sem
     travar isso, os itens perdem altura em telas mais baixas — 34px viravam
     30,14px numa janela de 760px — e a nav sai da grade de 4px. Quem cede
     espaço tem de ser a rolagem da sidebar, não a altura dos itens. */
  .sidebar > * { flex-shrink: 0; }

  /* Recolhida pelo hamburger: o Admin esconde a navegação inteira e o
     conteúdo assume a largura toda. box-sizing: border-box vem do reset do
     Shoreline, então os itens colapsam junto com o padding. */
  /* O padding lateral também zera: com box-sizing: border-box, width 0 ainda
     deixaria os 40px de padding ocupando espaço. */
  .nav-collapsed .sidebar { width: 0; padding-left: 0; padding-right: 0; border-right-width: 0; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--sl-color-gray-4); border-radius: var(--sl-radius-full); }

  /* Área de 36px no item e no sub-item. Os tokens de texto trazem 14px/20px:
     13px não existe na escala do Shoreline, que só tem 12, 14, 16, 20 e 24px.

     O raio de 6px não é token do Shoreline — fica entre radius-1 (4px) e
     radius-2 (8px) — mas é o que o Figma usa: calibrei o avanço do canto do
     print contra pílulas de 4, 6, 8 e 12px, e só o de 6px bate. */
  .nav-item, .nav-sub-item {
    display: flex; align-items: center;
    width: 100%; height: 36px;
    border: none; border-radius: 6px; background: transparent;
    font: var(--sl-text-body-font); letter-spacing: var(--sl-text-body-letter-spacing);
    color: var(--sl-fg-muted); text-align: left; cursor: pointer;
  }
  /* Sobre uma superfície soft, gray-1 de hover seria invisível: é a mesma cor do
     fundo. O hover neutro do Shoreline é uma camada de gray-12 a 5%, que escurece
     qualquer superfície por baixo. */
  .nav-item:hover, .nav-sub-item:hover {
    background: var(--sl-bg-muted-plain-hover); color: var(--sl-fg-muted-hover);
  }

  /* O ícone encosta na borda esquerda da linha, e o rótulo começa 20px depois
     dele: é o que o print mostra, ícone a 20px da borda da nav e rótulo a 60px.
     Os 4px à direita são o respiro do caret. Os 4px de baixo são a folga entre
     itens — o passo do print é 40px no item e 36px no sub-item, que é contíguo. */
  .nav-item {
    gap: var(--sl-space-5);
    padding-right: var(--sl-space-1);
    margin-bottom: var(--sl-space-1);
  }
  /* O ícone herda a cor do item, então acompanha o hover junto com o rótulo. */
  .nav-item svg { flex-shrink: 0; }
  .nav-item-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item-expanded .nav-item-label {
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
    color: var(--sl-fg-base);
  }
  .caret { display: flex; align-items: center; color: var(--sl-fg-base-soft); }

  /* 40px = os 20px do ícone mais os 20px de gap, para o sub-item alinhar com o
     rótulo do item. No print os dois nascem no mesmo x. */
  .nav-sub-item {
    padding: 0 var(--sl-space-1) 0 40px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* O item selecionado é uma pílula recuada 20px de cada lado, o que vem do
     padding da própria sidebar. A cor medida no print é #eaeaea, que é
     exatamente gray-12 a 5% sobre a superfície soft — ou seja, a camada que o
     Shoreline chama de hover, não de pressed. Mantenho o valor do Figma e uso a
     camada de 10% no hover, senão passar o mouse no item ativo não daria
     retorno nenhum. */
  .nav-sub-item-active {
    background: var(--sl-bg-muted-plain-hover); color: var(--sl-fg-accent);
    font: var(--sl-text-emphasis-font); letter-spacing: var(--sl-text-emphasis-letter-spacing);
  }
  .nav-sub-item-active:hover {
    background: var(--sl-bg-muted-plain-pressed); color: var(--sl-fg-accent);
  }

  /* 20px acima e 8px abaixo, alinhado com os sub-itens: no print o bloco do
     rótulo ocupa 44px entre a última linha de um grupo e a primeira do outro. */
  .nav-group-label {
    padding: var(--sl-space-5) 0 var(--sl-space-2) 40px;
    font: var(--sl-text-caption-1-font); letter-spacing: var(--sl-text-caption-1-letter-spacing);
    color: var(--sl-fg-base-soft);
  }

  /* Respiro entre grupos: no print são 24px entre a última linha do grupo
     "Inventário" e o item seguinte, que é o respiro de 20px mais os 4px de folga
     que todo item já carrega. Um sub-item não tem folga embaixo, então aqui os
     24px vêm inteiros deste margin. */
  .nav-item-group-start { margin-top: var(--sl-space-6); }

  .content { flex: 1; min-width: 0; overflow-y: auto; background: var(--sl-bg-base); }

  /* O padding do cabeçalho vem do Container + Content do próprio Shoreline
     (ver a marcação de [data-sl-page-header-container]), não de regra própria. */

  /* ─────────────────────────────────────────────────────────────
     Layout da listagem
     ───────────────────────────────────────────────────────────── */

  /* Busca, filtros, tabela e paginação vivem dentro de [data-sl-collection] e
     [data-sl-collection-row], que são os contêineres oficiais da listagem: uma
     pilha vertical com gap e linhas flex. Nenhum dos dois tem borda, fundo ou
     raio — a tabela do Admin não é um cartão. */

  /* A busca encolhe antes da paginação: o Shoreline não impede o rótulo
     "1 — 25 de 74" de quebrar, então quem cede espaço é o campo de busca. */
  .toolbar-end { display: flex; align-items: center; gap: var(--sl-space-5); flex-shrink: 0; }
  .list-search { flex: 1 1 300px; min-width: 200px; max-width: 340px; }

  /* Dois botões, não Tab: Tab pressupõe um painel montado por aba e estado
     próprio de cada painel, e as duas visões compartilham de propósito a mesma
     busca, os mesmos filtros e a mesma paginação. */
  .segmented { display: flex; gap: var(--sl-space-1); }

  /* Posicionamento do popover é responsabilidade do React Aria no Shoreline.
     Em HTML estático, faço à mão — a aparência continua vindo do CSS oficial. */
  .filter { position: relative; }
  .filter-popover { position: absolute; top: calc(100% + var(--sl-space-2)); left: 0; display: none; }
  .filter[data-open="true"] .filter-popover { display: block; }

  /* Mesma ancoragem à mão para o Calendar que o DatePicker abre. Ele fica com a
     largura que os sete dias pedem, então é mais largo que o popover de filtro e
     sobra para a direita — é o mesmo bottom-start do componente, que também não
     se limita à largura do campo. O min-width de 320px do DatePicker não caberia
     nos 260px do popover; ele é custom property justamente para ser ajustado. */
  .date-picker { position: relative; width: 100%; }
  .date-picker [data-sl-date-picker-input] { --sl-datepicker-min-width: 0; }
  .calendar-popover { position: absolute; top: calc(100% + var(--sl-space-2)); left: 0; display: none; }
  .date-picker[data-open="true"] .calendar-popover { display: block; }

  /* Mesma ancoragem à mão para o ContextualHelp do cabeçalho "Destino". No
     Shoreline o popover é levado para o body por portal, então nunca herda o
     white-space: nowrap da célula de cabeçalho — aqui ele é filho da célula, e
     sem desfazer o nowrap o texto sairia numa linha só. */
  .header-help { position: relative; display: flex; }
  .header-help-popover {
    position: absolute; top: calc(100% + var(--sl-space-2)); left: 0;
    display: none; white-space: normal;
  }
  .header-help[data-open="true"] .header-help-popover { display: block; }

  /* Intervalo de data e de quantidade não são FilterItem: o Filter do Shoreline
     não tem primitiva para intervalo. Nosso aqui é só o arranjo em par — cada
     campo é Field + Label + Input, os dois empilhados num Stack, e o aviso de
     intervalo invertido é um FieldError. Nada disso precisa de CSS local. As
     listas de opção usam data-sl-filter-list e data-sl-filter-item. */

  /* Desvio deliberado do CSS que o Shoreline publica hoje: o hover do item
     responde no tipo do item, não na linha. Num item de múltipla escolha quem
     reage é a caixa, com os mesmos estados do Checkbox. O CSS do Filter mostra
     essa migração pela metade — ele declara o fundo de pressed e de item ativo
     e, três regras abaixo, desfaz os dois, deixando só o hover da linha para
     trás. Como o <style> daqui está fora de @layer, ele vence a camada
     sl-components sem precisar de especificidade extra. */
  [data-sl-filter-item]:hover,
  [data-sl-filter-item]:active {
    background: var(--sl-bg-muted-plain);
    color: var(--sl-fg-base);
  }
  [data-sl-filter-item]:hover [data-sl-filter-item-check] {
    border: var(--sl-border-base-strong-hover);
  }
  /* Marcada, a caixa fica coberta pelo indicador, que esconde a borda sob um
     anel de 1px da própria cor de fundo. Por isso o anel acompanha o fundo em
     cada estado, senão a borda antiga reapareceria por baixo. */
  [data-sl-filter-item]:hover [data-sl-filter-item-check-indicator] {
    background: var(--sl-bg-accent-strong-hover);
    box-shadow: 0 0 0 var(--sl-filter-item-check-border-width) var(--sl-bg-accent-strong-hover);
  }
  [data-sl-filter-item]:active [data-sl-filter-item-check-indicator] {
    background: var(--sl-bg-accent-strong-pressed);
    box-shadow: 0 0 0 var(--sl-filter-item-check-border-width) var(--sl-bg-accent-strong-pressed);
  }

  /* Rodapé de carregamento da lista de destinos. O Shoreline não tem esse
     elemento porque não tem scroll infinito em filtro; o spinner é dele. */
  .filter-list-more {
    display: flex;
    justify-content: center;
    padding: var(--sl-space-3) var(--sl-space-0);
    color: var(--sl-fg-base-soft);
  }

  /* 20px da primeira linha + 4px de gap + 16px da segunda = 40px, que com os
     12px de padding da densidade default fecham a linha de 64px do Shoreline. */
  .cell-stack { display: flex; flex-direction: column; gap: var(--sl-space-1); min-width: 0; }
  .cell-soft { font: var(--sl-text-caption-1-font); color: var(--sl-fg-base-soft); }
  .num { justify-content: flex-end; text-align: right; }
  .muted { color: var(--sl-fg-base-soft); }

  /* 16px entre as colunas da direita. A densidade default do Shoreline aplica
     12px nos quatro lados, e o vão entre dois conteúdos é a soma dos paddings
     vizinhos: 24px. Para chegar a 16px, o grupo da direita usa 8px na lateral.
     O padding vertical continua em 12px, que é o que sustenta a linha de 64px. */
  [data-sl-table] [data-sl-table-cell]:nth-child(n + 2),
  [data-sl-table] [data-sl-table-header-cell]:nth-child(n + 2) {
    padding-left: var(--sl-space-2);
    padding-right: var(--sl-space-2);
  }
  /* A borda externa fica nos 12px da densidade, senão o menu de cada linha sai
     do alinhamento com a paginação e com o cabeçalho da página. */
  [data-sl-table] [data-sl-table-cell]:last-child,
  [data-sl-table] [data-sl-table-header-cell]:last-child {
    padding-right: var(--sl-space-3);
  }

  .lot-cell { display: flex; align-items: center; gap: var(--sl-space-2); min-width: 0; }
  .lot-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* O botão de expandir é o IconButton do Shoreline, sem CSS próprio: os estados
     de hover, pressed, foco e desabilitado vêm da variante tertiary. */

  /* Miniatura mais pilha de texto: a mesma célula na linha filha da visão por
     lote e na linha da visão por SKU. */
  .sku-cell, .product-cell { display: flex; align-items: center; gap: var(--sl-space-3); min-width: 0; }

  /* Só a linha filha recua: 28px levam o SKU até depois do botão de expandir do
     lote, que tem 36px e, com o Bleed de -8px de cada lado, deixa 20px na
     célula, mais o gap de 8px. A visão por SKU não tem botão de expandir. */
  .sku-cell { padding-left: 28px; }
  .sku-thumb {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px; border-radius: var(--sl-radius-2);
    background: var(--sl-color-gray-2); color: var(--sl-color-gray-8);
  }

  /* O Figma desenha a imagem do produto em 44px, o que somado aos 12px de
     padding da densidade default daria uma linha de 68px. 40px é o maior
     quadro que fecha exatamente os 64px que a Table prescreve. */
  .product-thumb {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: var(--sl-radius-2);
    background: var(--sl-color-gray-2); color: var(--sl-color-gray-8);
  }

  .row-child [data-sl-table-cell] { background: var(--sl-bg-base-soft); }

  /* Fora do Shoreline: o Figma trata lote aberto e seus SKUs como um bloco só.
     Por isso a linha do lote perde a borda de baixo quando está aberta, e a
     última filha fecha o bloco só com o arredondamento e o fundo cinza, sem
     borda — a mudança de cor já demarca onde o bloco termina.
     As linhas são display: contents, então o raio vai nas células das pontas. */
  [data-sl-table-row][data-expanded="true"] > [data-sl-table-cell],
  .row-child-last > [data-sl-table-cell] { border-bottom: none; }

  .row-child-last > [data-sl-table-cell]:first-child { border-bottom-left-radius: 12px; }
  .row-child-last > [data-sl-table-cell]:last-child { border-bottom-right-radius: 12px; }
</style>
</head>

<body>
<div class="shell">

  <header class="topbar">
    <div class="topbar-start">
      <button data-sl-button data-sl-icon-button data-variant="tertiary" data-size="normal"
              id="btn-menu" aria-label="Menu" aria-expanded="true" aria-controls="sidebar">
        <span data-sl-button-content>
          <i data-icon="list"></i>
        </span>
      </button>
      <div class="logo-account">
        <span class="logo">
          <!-- Desenho exportado do próprio Figma: o logo não é um ícone do
               Shoreline, então não sai da biblioteca de ícones. -->
          <svg width="24" height="20.571" viewBox="0 0 23.9997 20.571" fill="none" role="img" aria-label="VTEX">
            <path d="M22.2027 0C23.5561 0.000285555 24.4223 1.4451 23.7876 2.64355L14.8042 19.5898C14.1104 20.8999 12.2379 20.8974 11.5464 19.5859L9.58157 15.8574L8.01516 18.8125C7.91354 19.0049 7.76172 19.166 7.57571 19.2783C7.38966 19.3906 7.17665 19.4502 6.95949 19.4502C6.74231 19.4502 6.52936 19.3906 6.34328 19.2783C6.1572 19.166 6.0045 19.0049 5.90285 18.8125L0.137229 7.87207C0.0413395 7.6895 -0.00548147 7.48456 0.000510567 7.27832C0.00657233 7.07223 0.0651566 6.87087 0.171409 6.69434C0.277712 6.5178 0.427859 6.37193 0.606956 6.27051C0.786036 6.16912 0.98821 6.11537 1.19387 6.11523H4.44387L2.65188 2.71191C2.00181 1.48068 2.89122 0 4.28078 0H22.2027ZM5.73782 6.10059C5.60089 6.10101 5.46625 6.13726 5.34719 6.20508C5.22822 6.27291 5.12854 6.37061 5.05813 6.48828C4.9878 6.60595 4.94849 6.73982 4.94485 6.87695C4.94122 7.01418 4.97353 7.15017 5.03762 7.27148L8.87356 14.5498C8.94122 14.6775 9.04196 14.7848 9.16555 14.8594C9.28928 14.934 9.43132 14.9736 9.57571 14.9736C9.7201 14.9736 9.86211 14.934 9.98586 14.8594C10.1096 14.7848 10.2111 14.6777 10.2788 14.5498L14.1519 7.24023C14.2144 7.12219 14.2461 6.99005 14.2427 6.85645C14.2392 6.72261 14.2011 6.59132 14.1323 6.47656C14.0636 6.36192 13.9662 6.26709 13.8501 6.20117C13.7339 6.13525 13.6018 6.10059 13.4683 6.10059H5.73782Z" fill="#E6175C"/>
          </svg>
        </span>
        <span class="account">account</span>
      </div>
    </div>

    <div class="topbar-center">
      <div class="topbar-search">
        <i data-icon="magnifying-glass-small"></i>
        <span>Search VTEX</span>
      </div>
